<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模様替えシミュレーター</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Meiryo","Hiragino Sans","Yu Gothic UI",sans-serif;font-size:14px;color:#222;background:#eef0f3}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#2f3e4e;color:#fff;flex-wrap:wrap}
header h1{font-size:16px;margin:0 12px 0 0;font-weight:bold}
header .sp{flex:1}
#saved,#cloud{font-size:12px;opacity:.75}
button{font:inherit;padding:4px 10px;border:1px solid #9aa5b1;background:#fff;border-radius:4px;cursor:pointer;color:#222}
button:hover{background:#e8f0fb}
header button{background:#435568;color:#fff;border-color:#62788f}
header button:hover{background:#536a82}
#modes{display:flex;background:#2f3e4e;padding:0 10px 8px;gap:6px}
#modes button{flex:1;max-width:220px;padding:8px;font-weight:bold;background:#435568;color:#dfe6ee;border-color:#62788f}
#modes button.on{background:#fff;color:#2f3e4e;border-color:#fff}
#tabs{display:flex;gap:2px;padding:6px 10px 0;background:#d5dbe2;flex-wrap:wrap}
#tabs button{border-radius:6px 6px 0 0;border-bottom:none;background:#c3cbd5}
#tabs button.on{background:#fff;font-weight:bold}
#main{flex:1;display:flex;min-height:0}
#left{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}
.bar{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid #dde2e8;flex-wrap:wrap}
.bar select{font:inherit;padding:3px;max-width:340px}
.hint{font-size:12px;color:#667}
#cvwrap{position:relative;flex:1;min-height:0;display:flex}
#cv{flex:1;width:100%;min-height:0;display:block;background:#f6f7f9;touch-action:none;user-select:none;cursor:grab}
#cv .mv{cursor:move}
#cv .hit{cursor:pointer}
#pad{position:absolute;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:4px}
#pad[hidden]{display:none}
#pad button{padding:0;font-size:18px;background:rgba(255,255,255,.92);box-shadow:0 1px 3px rgba(0,0,0,.2)}
#pad .st{font-size:11px}
aside{width:320px;overflow:auto;padding:10px 12px;background:#fafbfc;border-left:1px solid #dde2e8}
aside h3{font-size:14px;margin:14px 0 6px;padding-bottom:3px;border-bottom:2px solid #2f3e4e}
aside h3:first-child{margin-top:0}
aside label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:5px 0;font-size:13px}
aside input,aside select{font:inherit;width:140px;padding:3px 5px}
aside input[type=color]{padding:0;height:28px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.danger{color:#c0392b;border-color:#e0a9a2}
.primary{background:#1e6fd9;color:#fff;border-color:#1e6fd9;font-weight:bold}
.primary:hover{background:#185bb3}
ul.lst{list-style:none;padding:0;margin:0}
ul.lst li{padding:4px 6px;border-radius:4px;cursor:pointer;font-size:13px}
ul.lst li:hover{background:#e8f0fb}
ul.ng li.ng{color:#b42318}
ul.ng li.wn{color:#a15c00}
.ok{color:#1a7f37;font-size:13px}
.note{font-size:12px;color:#667;line-height:1.6}
.sw{display:inline-block;width:12px;height:12px;border:1px solid #555;vertical-align:-1px;margin-right:6px}
table.lv{width:100%;border-collapse:collapse;font-size:13px}
table.lv td{padding:3px 2px;border-bottom:1px solid #e3e7ec}
table.lv input{width:70px}
table.lv input.pt{width:90px}
table.lv tr.on td{background:#e8f0fb}
/* 候補リスト */
#candView{flex:1;overflow:auto;padding:12px;background:#f6f7f9}
#candView[hidden]{display:none}
.ctop{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.ctop .big{font-size:16px;padding:10px 18px}
.chip{border-radius:16px;padding:4px 12px}
.chip.on{background:#2f3e4e;color:#fff;border-color:#2f3e4e}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{background:#fff;border:1px solid #dde2e8;border-radius:8px;padding:10px;display:flex;gap:10px}
.card .ph{width:96px;height:96px;flex:none;border-radius:6px;background:#eef0f3;display:flex;align-items:center;justify-content:center;color:#99a;font-size:12px;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .bd{flex:1;min-width:0}
.card .nm{font-weight:bold;font-size:15px;margin-bottom:2px}
.card .mt{font-size:12px;color:#556;line-height:1.6}
.card .btns{margin:6px 0 0}
.card .btns button{font-size:12px;padding:4px 8px}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;margin-left:6px;vertical-align:2px;font-weight:normal}
.b-cand{background:#e8f0fb;color:#1e6fd9}.b-buy{background:#e3f4e8;color:#1a7f37}.b-skip{background:#eee;color:#777}
.form{background:#fff;border:2px solid #1e6fd9;border-radius:8px;padding:12px;margin-bottom:12px;max-width:560px}
.form label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}
.form input,.form select,.form textarea{font:inherit;width:62%;padding:5px}
.form textarea{height:60px}
.form .dims{display:flex;gap:6px;width:62%}
.form .dims input{width:33%}
.form .phbox{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.form .phbox .ph{width:120px;height:120px;border-radius:6px;background:#eef0f3;display:flex;align-items:center;justify-content:center;color:#99a;font-size:12px;overflow:hidden}
.form .phbox img{width:100%;height:100%;object-fit:cover}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:10}
#dlg[hidden]{display:none}
#dlg .box{background:#fff;border-radius:8px;padding:16px;width:min(92vw,380px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
#dlg .msg{white-space:pre-wrap;margin-bottom:10px;line-height:1.6}
#dlg input,#dlg select{width:100%;font-size:16px;padding:6px}
#dlg .btns{justify-content:flex-end}
.mhint{display:none}
[hidden]{display:none!important}
@media (max-width:820px){
  html,body{height:auto;font-size:15px}
  body{min-height:100%}
  header{flex-wrap:nowrap;overflow-x:auto;padding:4px 6px;gap:4px}
  header h1,#saved,.lg{display:none}
  #cloud{white-space:nowrap}
  #modes{padding:0 6px 6px}
  button{padding:8px 10px;white-space:nowrap;flex:none}
  .bar{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;padding:4px 6px}
  #tabs{flex-wrap:nowrap;overflow-x:auto;padding:4px 6px 0}
  #main{flex-direction:column}
  #left{flex:none;height:82vh;height:82svh}
  #main.cand #left{height:auto;min-height:82svh}
  aside{width:auto;border-left:none;border-top:1px solid #dde2e8;overflow:visible}
  aside input,aside select{font-size:16px;width:170px}
  table.lv input{width:64px;font-size:16px}
  .bar select,.form input,.form select,.form textarea{font-size:16px}
  .form input,.form select,.form textarea,.form .dims{width:66%}
  .cards{grid-template-columns:1fr}
  .phint{display:none}
  .mhint{display:flex}
}
</style>
</head>
<body>
<header>
  <h1>模様替えシミュレーター</h1>
  <button data-act="undo" title="Ctrl+Z">↶<span class="lg"> 元に戻す</span></button>
  <button data-act="redo" title="Ctrl+Y">↷<span class="lg"> やり直し</span></button>
  <button data-act="fit" id="fitBtn">全体<span class="lg">表示</span></button>
  <span class="sp"></span>
  <span id="saved"></span> <span id="cloud"></span>
  <button data-act="export"><span class="lg">ファイルに</span>書き出す</button>
  <button data-act="import"><span class="lg">ファイルを</span>読み込む</button>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
</header>
<nav id="modes">
  <button data-act="mode" data-m="plan">間取り</button>
  <button data-act="mode" data-m="shelf">棚</button>
  <button data-act="mode" data-m="cand">候補リスト</button>
</nav>
<div id="tabs"></div>
<div id="main">
  <div id="left">
    <div class="bar" id="bar1"></div>
    <div class="bar" id="bar2"></div>
    <div id="cvwrap"><svg id="cv" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="pad" hidden>
        <span></span><button data-act="nudge" data-dx="0" data-dy="-1" id="padU">↑</button><button data-act="padStep" class="st" id="padStep">10mm</button>
        <button data-act="nudge" data-dx="-1" data-dy="0">←</button><button data-act="rot" id="padRot" title="90°回転">⟳</button><button data-act="nudge" data-dx="1" data-dy="0">→</button>
        <span></span><button data-act="nudge" data-dx="0" data-dy="1" id="padD">↓</button><span></span>
      </div></div>
    <div id="candView" hidden></div>
    <div class="bar hint mhint" id="mhint"></div>
    <div class="bar hint phint" id="phint"></div>
  </div>
  <aside id="panel"></aside>
</div>
<div id="dlg" hidden><div class="box"><div class="msg" id="dlgMsg"></div><input id="dlgIn"><select id="dlgSel"></select><div class="btns"><button id="dlgCancel">キャンセル</button><button id="dlgOk" class="primary">OK</button></div></div></div>
<input type="file" id="photoIn" accept="image/*" hidden>
<script>
'use strict';
const KEY='moyougae_v1', T=120;
const WALLS={top:'上の壁',right:'右の壁',bottom:'下の壁',left:'左の壁'};
const COLORS=['#c8a27a','#8fb3d9','#a8c98f','#e0b0c0','#d9c27a','#b0a0d0','#9fd0c8','#d99f8f'];
const svg=document.getElementById('cv'), panel=document.getElementById('panel');
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r1=v=>Math.round(v);
const s10=v=>Math.round(v/10)*10;

/* ---------- データ ---------- */
function newPlan(name){return {id:uid(),name,furniture:[]}}
function newRoom(name,w,d){const p=newPlan('案1');return {id:uid(),name,w,d,fixtures:[],plans:[p],planId:p.id}}
function sample(){
  const r=newRoom('リビング',3640,4550);
  r.fixtures.push({id:uid(),type:'door',wall:'bottom',offset:2700,width:780,kind:'hinged',hinge:'end',swing:'in',slide:'end'});
  r.fixtures.push({id:uid(),type:'window',wall:'top',offset:900,width:1690,sill:900});
  r.fixtures.push({id:uid(),type:'outlet',wall:'left',offset:1800,kind:'outlet'});
  r.fixtures.push({id:uid(),type:'obstacle',name:'柱',x:3340,y:0,w:300,d:300});
  const p=r.plans[0];p.name='案1：今の配置';
  p.furniture.push({id:uid(),name:'ソファ',w:1800,d:850,h:800,color:COLORS[0],x:200,y:3500,rot:0});
  p.furniture.push({id:uid(),name:'テレビ台',w:1500,d:400,h:450,color:COLORS[1],x:0,y:1100,rot:1});
  return {version:2,rooms:[r],cur:0,shelves:[],cands:[]};
}
function migrate(d){
  d.version=2;if(!Array.isArray(d.shelves))d.shelves=[];if(!Array.isArray(d.cands))d.cands=[];
  if(!(d.cur>=0&&d.cur<d.rooms.length))d.cur=0;
  return d;
}
let S=null,PHOTOS={};
let snap='',hist=[],fut=[];
let localAt=0;try{localAt=Number(localStorage.getItem(KEY+'_at'))||0}catch(e){}
const DEV=uid(),CAP={downloads:null,inArtifact:false};
let cloud=null,cloudBusy=false,cloudDirty=false,cloudTimer=null,pendingRemote=null;
let sel=null,drag=null,V={s:0.1,tx:40,ty:40},padStep=10,lastChk={bad:new Set(),warn:new Set(),msgs:[]};
let UI={mode:'plan',shelfRef:null,level:0,cfilter:'all'};
try{Object.assign(UI,JSON.parse(localStorage.getItem(KEY+'_ui'))||{})}catch(e){}
let candEdit=null; // 編集中の候補（下書き）
const saveUI=()=>{try{localStorage.setItem(KEY+'_ui',JSON.stringify({mode:UI.mode,shelfRef:UI.shelfRef,level:UI.level,cfilter:UI.cfilter}))}catch(e){}};

const room=()=>{if(!(S.cur>=0&&S.cur<S.rooms.length))S.cur=0;return S.rooms[S.cur]};
const plan=()=>{const r=room();let p=r.plans.find(p=>p.id===r.planId);if(!p){p=r.plans[0];r.planId=p.id}return p};

/* ---------- 保存（IndexedDB、使えなければ localStorage） ---------- */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{const q=indexedDB.open('moyougae',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{this.db=q.result;res()};q.onerror=()=>rej(q.error)})},
  get(k){return new Promise((res,rej)=>{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  set(k,v){return new Promise((res,rej)=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}};
let saveTimer=null;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,250)}
async function saveNow(){
  const j=JSON.stringify(S);let ok=false;
  if(IDB.db){try{await IDB.set('state',j);ok=true}catch(e){}}
  if(!ok){try{localStorage.setItem(KEY,j);ok=true}catch(e){}}
  $('saved').textContent=ok?'自動保存済み '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'自動保存できません（ファイルに書き出してください）';
}
async function savePhotos(){if(IDB.db){try{await IDB.set('photos',PHOTOS)}catch(e){note('写真を保存できませんでした。容量が足りない可能性があります。')}}}
function changed(){save();localAt=Date.now();try{localStorage.setItem(KEY+'_at',String(localAt))}catch(e){}if(cloud){clearTimeout(cloudTimer);cloudTimer=setTimeout(pushCloud,1500)}}
function commit(){const j=JSON.stringify(S);if(j!==snap){hist.push(snap);if(hist.length>150)hist.shift();fut=[];snap=j;changed()}render()}
function afterRestore(){migrate(S);changed();if(!selItem())sel=null;render()}
function undo(){if(!hist.length)return;fut.push(snap);snap=hist.pop();S=JSON.parse(snap);afterRestore()}
function redo(){if(!fut.length)return;hist.push(snap);snap=fut.pop();S=JSON.parse(snap);afterRestore()}

/* ---------- 画面内ダイアログ ---------- */
function dialog(msg,{input=null,options=null,cancel=true}={}){
  return new Promise(res=>{
    const d=$('dlg'),inp=$('dlgIn'),sl=$('dlgSel'),ok=$('dlgOk'),cc=$('dlgCancel');
    $('dlgMsg').textContent=msg;
    inp.hidden=input===null;inp.value=input??'';
    sl.hidden=!options;if(options)sl.innerHTML=options.map((o,i)=>`<option value="${i}">${esc(o)}</option>`).join('');
    cc.hidden=!cancel;d.hidden=false;
    if(input!==null)setTimeout(()=>inp.focus(),30);
    const done=v=>{d.hidden=true;ok.onclick=cc.onclick=inp.onkeydown=null;res(v)};
    ok.onclick=()=>done(options?Number(sl.value):input===null?true:inp.value);
    cc.onclick=()=>done(input===null&&!options?false:null);
    inp.onkeydown=e=>{if(e.key==='Enter')ok.onclick();if(e.key==='Escape')cc.onclick()};
  });
}
const ask=(m,v)=>dialog(m,{input:v}),confirmBox=m=>dialog(m),note=m=>dialog(m,{cancel:false}),choose=(m,o)=>dialog(m,{options:o});

/* ---------- 間取りの幾何 ---------- */
const fp=f=>({x:f.x,y:f.y,w:f.rot?f.d:f.w,h:f.rot?f.w:f.d});
const ob=o=>({x:o.x,y:o.y,w:o.w,h:o.d});
const box=(p,q)=>({x:Math.min(p[0],q[0]),y:Math.min(p[1],q[1]),w:Math.abs(q[0]-p[0]),h:Math.abs(q[1]-p[1])});
const hit=(a,b)=>a.x<b.x+b.w-0.5&&b.x<a.x+a.w-0.5&&a.y<b.y+b.h-0.5&&b.y<a.y+a.h-0.5;
function WI(r,wall){switch(wall){
  case 'top':return {ox:0,oy:0,tx:1,ty:0,nx:0,ny:1,L:r.w};
  case 'bottom':return {ox:0,oy:r.d,tx:1,ty:0,nx:0,ny:-1,L:r.w};
  case 'left':return {ox:0,oy:0,tx:0,ty:1,nx:1,ny:0,L:r.d};
  default:return {ox:r.w,oy:0,tx:0,ty:1,nx:-1,ny:0,L:r.d};}}
function leafs(r,x){
  const W=WI(r,x.wall),P=o=>[W.ox+W.tx*o,W.oy+W.ty*o];
  const s=(x.type==='closet'||x.swing!=='out')?1:-1,bx=W.nx*s,by=W.ny*s,L=[];
  if(x.kind==='hinged'){
    if(x.hinge==='end'){const [hx,hy]=P(x.offset+x.width);L.push({hx,hy,ax:-W.tx,ay:-W.ty,bx,by,R:x.width})}
    else{const [hx,hy]=P(x.offset);L.push({hx,hy,ax:W.tx,ay:W.ty,bx,by,R:x.width})}
  }else if(x.kind==='double'){
    const R=x.width/2;let [hx,hy]=P(x.offset);L.push({hx,hy,ax:W.tx,ay:W.ty,bx,by,R});
    [hx,hy]=P(x.offset+x.width);L.push({hx,hy,ax:-W.tx,ay:-W.ty,bx,by,R});
  }
  return {L,inside:s===1};
}
function leafBox(l){const x2=l.hx+(l.ax+l.bx)*l.R,y2=l.hy+(l.ay+l.by)*l.R;return box([l.hx,l.hy],[x2,y2])}
function hitLeaf(a,l){
  const b=leafBox(l),x0=Math.max(a.x,b.x),x1=Math.min(a.x+a.w,b.x+b.w),y0=Math.max(a.y,b.y),y1=Math.min(a.y+a.h,b.y+b.h);
  if(x1-x0<1||y1-y0<1)return false;
  const cx=Math.min(Math.max(l.hx,x0),x1),cy=Math.min(Math.max(l.hy,y0),y1);
  return Math.hypot(cx-l.hx,cy-l.hy)<l.R-1;
}
function slideBox(r,x){
  if(x.kind!=='sliding')return null;
  const W=WI(r,x.wall),a=x.slide==='end'?x.offset+x.width:x.offset-x.width,b=a+x.width,D=80;
  return box([W.ox+W.tx*a,W.oy+W.ty*a],[W.ox+W.tx*b+W.nx*D,W.oy+W.ty*b+W.ny*D]);
}
function winBox(r,x){const W=WI(r,x.wall),a=x.offset,b=a+x.width;return box([W.ox+W.tx*a,W.oy+W.ty*a],[W.ox+W.tx*b+W.nx*150,W.oy+W.ty*b+W.ny*150])}
const fixW=x=>x.type==='outlet'?0:x.width;
function rects(exceptId){
  const out=[];
  plan().furniture.forEach(f=>{if(f.id!==exceptId)out.push({id:f.id,...fp(f)})});
  room().fixtures.forEach(x=>{if(x.type==='obstacle'&&x.id!==exceptId)out.push({id:x.id,...ob(x)})});
  return out;
}
function checkPlan(){
  const r=room(),F=plan().furniture,bad=new Set(),msgs=[],nm=f=>`「${f.name}」`;
  const add=(id,t)=>{bad.add(id);msgs.push({id,t,c:'ng'})};
  F.forEach(f=>{
    const a=fp(f);
    if(a.x<-0.5||a.y<-0.5||a.x+a.w>r.w+0.5||a.y+a.h>r.d+0.5)add(f.id,`${nm(f)}が部屋からはみ出しています`);
    r.fixtures.forEach(x=>{
      if(x.type==='obstacle'&&hit(a,ob(x)))add(f.id,`${nm(f)}が${nm(x)}と重なっています`);
      if(x.type==='door'||x.type==='closet'){
        const lab=(x.type==='door'?'ドア':'収納の扉')+`（${WALLS[x.wall]}）`;
        const {L,inside}=leafs(r,x);
        if(inside&&L.some(l=>hitLeaf(a,l)))add(f.id,`${nm(f)}が${lab}の開く範囲にかかっています`);
        const sb=slideBox(r,x);if(sb&&hit(a,sb))add(f.id,`${nm(f)}が${lab}の引き込み範囲にかかっています`);
      }
      if(x.type==='window'&&hit(a,winBox(r,x))&&f.h>x.sill)add(f.id,`${nm(f)}（高さ${f.h}）が窓（${WALLS[x.wall]}、腰高${x.sill}）にかかっています`);
    });
  });
  for(let i=0;i<F.length;i++)for(let j=i+1;j<F.length;j++)
    if(hit(fp(F[i]),fp(F[j]))){bad.add(F[j].id);add(F[i].id,`${nm(F[i])}と${nm(F[j])}が重なっています`)}
  return {bad,warn:new Set(),msgs};
}

/* ---------- 棚 ---------- */
function defaultShelf(H){
  const t=18,n=Math.max(1,Math.min(8,Math.round((H-t)/350)));
  const h=Math.max(50,Math.floor((H-t*(n+1))/n));

function shelfList(){
  const L=[];

  S.shelves.forEach(s=>L.push({ref:{t:'s',id:s.id},label:`${s.name}（単独）`,holder:s,sh:s.shelf,linked:false}));
  return L;
}
const refKey=r=>!r?'':r.t==='f'?`f:${r.r}:${r.p}:${r.f}`:`s:${r.id}`;
function shelfCtx(){
  const L=shelfList();let c=L.find(x=>refKey(x.ref)===refKey(UI.shelfRef));
  if(!c&&L.length){c=L[0];UI.shelfRef=c.ref}
  if(c){if(!(UI.level>=0&&UI.level<c.sh.levels.length))UI.level=Math.max(0,c.sh.levels.length-1)}

}
function SG(c){
  const sh=c.sh,t=sh.t,iw=sh.iw||Math.max(10,c.holder.w-2*t),idp=sh.idp||c.holder.d,base=[];
  let y=t;sh.levels.forEach(lv=>{base.push(y);y+=lv.h+t});
  return {t,iw,idp,base,Ht:y,W:iw+2*t};
}
const lvName=(c,li)=>`上から${c.sh.levels.length-li}段目`;
function itemY(lv,it,d=0){if(!it.on||d>20)return 0;const b=lv.items.find(o=>o.id===it.on);return b?itemY(lv,b,d+1)+b.h:0}
function subtree(lv,id){const s=new Set([id]);let grow=true;while(grow){grow=false;lv.items.forEach(o=>{if(o.on&&s.has(o.on)&&!s.has(o.id)){s.add(o.id);grow=true}})}return s}
function findShelfItem(c,id){for(let li=0;li<c.sh.levels.length;li++){const lv=c.sh.levels[li],it=lv.items.find(o=>o.id===id);if(it)return {lv,li,it}}return null}
function checkShelf(c){
  const g=SG(c),bad=new Set(),warn=new Set(),msgs=[];
  c.sh.levels.forEach((lv,li)=>{
    const nm=lvName(c,li);
    lv.items.forEach(it=>{
      const Y=itemY(lv,it),q=`「${it.name}」`;
      const ng=t=>{bad.add(it.id);msgs.push({id:it.id,t,c:'ng'})};
      if(Y+it.h>lv.h+0.5)ng(`${q}が${nm}の高さを${r1(Y+it.h-lv.h)}mm超えています`);
      if(it.x<-0.5||it.x+it.w>g.iw+0.5)ng(`${q}が棚の幅からはみ出しています`);
      (lv.parts||[]).forEach(p=>{if(it.x<p+g.t-0.5&&it.x+it.w>p+0.5)ng(`${q}が仕切りにかかっています`)});
      if(it.zb+it.d>g.idp+0.5){warn.add(it.id);msgs.push({id:it.id,t:`${q}が手前に${r1(it.zb+it.d-g.idp)}mm飛び出しています`,c:'wn'})}
    });
    for(let i=0;i<lv.items.length;i++)for(let j=i+1;j<lv.items.length;j++){
      const a=lv.items[i],b=lv.items[j],ya=itemY(lv,a),yb=itemY(lv,b);
      if(a.x<b.x+b.w-0.5&&b.x<a.x+a.w-0.5&&a.zb<b.zb+b.d-0.5&&b.zb<a.zb+a.d-0.5&&ya<yb+b.h-0.5&&yb<ya+a.h-0.5){bad.add(a.id);bad.add(b.id);msgs.push({id:a.id,t:`「${a.name}」と「${b.name}」が重なっています（${nm}）`,c:'ng'})}
    }
  });
  const g2=SG(c);if(g2.Ht>c.holder.h+0.5)msgs.push({id:null,t:`段の合計（${r1(g2.Ht)}mm）が棚の外寸高さ（${c.holder.h}mm）を超えています`,c:'wn'});
  return {bad,warn,msgs};
}

function txt(x,y,s,fs,extra=''){return `<text x="${x}" y="${y}" font-size="${fs}" text-anchor="middle" dominant-baseline="middle" paint-order="stroke" stroke="#fff" stroke-width="${fs*0.25}" ${extra}>${esc(s)}</text>`}
function arcPath(l){
  const C=[l.hx+l.ax*l.R,l.hy+l.ay*l.R],E=[l.hx+l.bx*l.R,l.hy+l.by*l.R];

function dimLine(x1,y1,x2,y2,d,fs,px,col='#1e6fd9',label=null){

         :`<line x1="${x1}" y1="${y1-t}" x2="${x1}" y2="${y1+t}" stroke="${col}" stroke-width="${sw}"/><line x1="${x2}" y1="${y2-t}" x2="${x2}" y2="${y2+t}" stroke="${col}" stroke-width="${sw}"/>`;

function distances(a,O,bounds,fs,px){
  const cx=a.x+a.w/2,cy=a.y+a.h/2,oy=o=>o.y<a.y+a.h-0.5&&a.y<o.y+o.h-0.5,ox=o=>o.x<a.x+a.w-0.5&&a.x<o.x+o.w-0.5;

  b=bounds.x0;O.forEach(o=>{if(oy(o)&&o.x+o.w<=a.x+0.5)b=Math.max(b,o.x+o.w)});if(a.x-b>0.5)s+=dimLine(b,cy,a.x,cy,a.x-b,fs,px);
  b=bounds.x1;O.forEach(o=>{if(oy(o)&&o.x>=a.x+a.w-0.5)b=Math.min(b,o.x)});if(b-a.x-a.w>0.5)s+=dimLine(a.x+a.w,cy,b,cy,b-a.x-a.w,fs,px);

function wallDims(r,x,fs,px){

  }else if(it.type==='obstacle'){
    h+=`<h3>障害物</h3><div data-t="sel">${field('名前','name',it.name,'text')}${field('幅（左右）mm','w',it.w)}${field('奥行き（上下）mm','d',it.d)}${field('左の壁から mm','x',it.x)}${field('上の壁から mm','y',it.y)}</div><div class="btns"><button data-act="del" class="danger">削除</button></div>`;
  }else{
    const ttl={door:'ドア',window:'窓',outlet:'コンセント・スイッチ',closet:'収納（クローゼット・押入れ）'}[it.type];
    const W=WI(r,it.wall),rest=W.L-it.offset-fixW(it),st=['top','bottom'].includes(it.wall)?['左端','右端']:['上端','下端'];

    if(it.type!=='outlet')h+=field('幅 mm','width',it.width);
    if(it.type==='window')h+=field('腰高（床から窓下）mm','sill',it.sill);
    if(it.type==='outlet')h+=pick('種類','kind',it.kind,{outlet:'コンセント',switch:'スイッチ'});
    if(it.type==='door'||it.type==='closet'){
      h+=pick('種類','kind',it.kind,{hinged:'開き戸（片開き）',double:'両開き',sliding:'引き戸（片引き）',hikichigai:'引き違い'});
      if(it.kind==='hinged')h+=pick('吊り元','hinge',it.hinge,{start:`${st[0]}側`,end:`${st[1]}側`});
      if(it.type==='door'&&(it.kind==='hinged'||it.kind==='double'))h+=pick('開く向き','swing',it.swing,{in:'内開き（この部屋側）',out:'外開き'});
      if(it.kind==='sliding')h+=pick('引き込む向き','slide',it.slide,{start:`${st[0]}側`,end:`${st[1]}側`});
    }
    h+=`</div><div class="btns"><button data-act="del" class="danger">削除</button></div>`;
  }
  panel.innerHTML=h+checkHtml();
}

function renderShelf(){
  const c=shelfCtx(),px=1/V.s,fs=13*px;
  if(!c){svg.innerHTML=`<text x="20" y="40" font-size="14" fill="#667">棚がまだありません</text>`;lastChk={bad:new Set(),warn:new Set(),msgs:[]};updatePad();return}
  const g=SG(c),chk=checkShelf(c);lastChk=chk;
  const isSel=id=>sel&&sel.id===id;
  let s=defs(px)+`<g transform="translate(${V.tx} ${V.ty}) scale(${V.s})">`;
  // 正面図
  s+=txt(g.W/2,-fs*2.2,`正面図　${c.holder.name}（外寸 ${c.holder.w}×${c.holder.d}×H${c.holder.h}）`,fs,'fill="#333" font-weight="bold"');
  s+=`<rect x="0" y="0" width="${g.W}" height="${g.Ht}" fill="#d8c3a0" stroke="#8a7350" stroke-width="${px}"/>`;
  c.sh.levels.forEach((lv,li)=>{
    const top=g.Ht-g.base[li]-lv.h,on=li===UI.level;
    s+=`<rect data-k="lv" data-i="${li}" class="hit" x="${g.t}" y="${top}" width="${g.iw}" height="${lv.h}" fill="${on?'#f3f8ff':'#fbfaf7'}" stroke="${on?'#1e6fd9':'none'}" stroke-width="${2*px}"/>`;
    (lv.parts||[]).forEach(p=>{s+=`<rect x="${g.t+p}" y="${top}" width="${g.t}" height="${lv.h}" fill="#d8c3a0" stroke="#8a7350" stroke-width="${px*0.6}" pointer-events="none"/>`});
    s+=txt(-fs*3.6,top+lv.h/2,`${lvName(c,li).replace('上から','')}`,fs*0.85,`fill="${on?'#1e6fd9':'#556'}" font-weight="bold"`);
    s+=txt(-fs*3.6,top+lv.h/2+fs*1.1,`H${lv.h}`,fs*0.75,'fill="#778"');
    const items=lv.items.slice().sort((a,b)=>a.zb-b.zb);
    items.forEach(it=>{
      const Y=itemY(lv,it),x=g.t+it.x,y=top+lv.h-Y-it.h,bad=chk.bad.has(it.id),wn=chk.warn.has(it.id);
      const behind=lv.items.some(o=>o!==it&&o.zb>=it.zb+it.d-0.5&&o.x<it.x+it.w-0.5&&it.x<o.x+o.w-0.5&&itemY(lv,o)<Y+it.h-0.5&&Y<itemY(lv,o)+o.h-0.5);
      s+=`<g data-k="sf" data-id="${it.id}" class="mv"><rect x="${x}" y="${y}" width="${it.w}" height="${it.h}" fill="${esc(it.color)}" fill-opacity="${behind?.35:.9}" stroke="${bad?'#d62828':wn?'#e8a200':'#333'}" stroke-width="${(bad||wn?2.5:1)*px}" ${behind?`stroke-dasharray="${5*px} ${3*px}"`:''}/>`;
      if(bad||wn)s+=`<rect x="${x}" y="${y}" width="${it.w}" height="${it.h}" fill="url(#${bad?'hbad2':'hwarn2'})" pointer-events="none"/>`;
      if(it.w*V.s>34&&it.h*V.s>16)s+=txt(x+it.w/2,y+it.h/2,(behind?'(奥) ':'')+it.name,fs*0.85,'fill="#111"');
      s+='</g>';
    });
  });
  // 上から見た図
  const lv=c.sh.levels[UI.level],oy=g.Ht+fs*6;
  if(lv){
    s+=txt(g.W/2,oy-fs*3,`上から見た図（${lvName(c,UI.level)}）`,fs,'fill="#333" font-weight="bold"');
    s+=txt(g.W/2,oy-fs*1.2,'奥',fs*0.85,'fill="#778"');
    s+=`<rect x="0" y="${oy-g.t}" width="${g.W}" height="${g.idp+g.t}" fill="#d8c3a0" stroke="#8a7350" stroke-width="${px}"/>`;
    s+=`<rect data-k="lv" data-i="${UI.level}" x="${g.t}" y="${oy}" width="${g.iw}" height="${g.idp}" fill="#fbfaf7"/>`;
    (lv.parts||[]).forEach(p=>{s+=`<rect x="${g.t+p}" y="${oy}" width="${g.t}" height="${g.idp}" fill="#d8c3a0" stroke="#8a7350" stroke-width="${px*0.6}" pointer-events="none"/>`});
    s+=`<line x1="${-fs}" y1="${oy+g.idp}" x2="${g.W+fs}" y2="${oy+g.idp}" stroke="#8a7350" stroke-width="${2*px}" stroke-dasharray="${6*px} ${4*px}"/>`;
    s+=txt(g.W/2,oy+g.idp+fs*1.3,`手前（奥行き内寸 ${r1(g.idp)}）`,fs*0.85,'fill="#778"');
    lv.items.slice().sort((a,b)=>itemY(lv,a)-itemY(lv,b)).forEach(it=>{
      const x=g.t+it.x,y=oy+it.zb,bad=chk.bad.has(it.id),wn=chk.warn.has(it.id),st=!!it.on;
      s+=`<g data-k="st" data-id="${it.id}" class="mv"><rect x="${x}" y="${y}" width="${it.w}" height="${it.d}" fill="${esc(it.color)}" fill-opacity=".85" stroke="${bad?'#d62828':wn?'#e8a200':'#333'}" stroke-width="${(bad||wn?2.5:1)*px}" ${st?`stroke-dasharray="${5*px} ${3*px}"`:''}/>`;
      if(it.w*V.s>34&&it.d*V.s>16)s+=txt(x+it.w/2,y+it.d/2,it.name+(st?'（重ね）':''),fs*0.85,'fill="#111"');
      s+='</g>';
    });
  }
  // 選択
  const f=sel&&findShelfItem(c,sel.id);
  if(f){
    const {lv:L,li,it}=f,top=g.Ht-g.base[li]-L.h,Y=itemY(L,it),x=g.t+it.x,y=top+L.h-Y-it.h,m=3*px;
    s+=`<rect x="${x-m}" y="${y-m}" width="${it.w+2*m}" height="${it.h+2*m}" fill="none" stroke="#1e6fd9" stroke-width="${2*px}" stroke-dasharray="${6*px} ${4*px}" pointer-events="none"/>`;
    // 正面：左右の隙間と上までの残り
    const others=L.items.filter(o=>o.id!==it.id).map(o=>({x:g.t+o.x,y:top+L.h-itemY(L,o)-o.h,w:o.w,h:o.h}));
    (L.parts||[]).forEach(p=>others.push({x:g.t+p,y:top,w:g.t,h:L.h}));
    s+=`<g pointer-events="none">${distances({x,y,w:it.w,h:it.h},others,{x0:g.t,x1:g.t+g.iw,y0:top,y1:top+L.h},fs,px)}</g>`;
    if(li===UI.level){
      const ty=oy+it.zb;
      s+=`<rect x="${x-m}" y="${ty-m}" width="${it.w+2*m}" height="${it.d+2*m}" fill="none" stroke="#1e6fd9" stroke-width="${2*px}" stroke-dasharray="${6*px} ${4*px}" pointer-events="none"/>`;
      const ot=L.items.filter(o=>o.id!==it.id&&itemY(L,o)<Y+it.h-0.5&&Y<itemY(L,o)+o.h-0.5).map(o=>({x:g.t+o.x,y:oy+o.zb,w:o.w,h:o.d}));
      (L.parts||[]).forEach(p=>ot.push({x:g.t+p,y:oy,w:g.t,h:g.idp}));
      s+=`<g pointer-events="none">${distances({x,y:ty,w:it.w,h:it.d},ot,{x0:g.t,x1:g.t+g.iw,y0:oy,y1:oy+Math.max(g.idp,it.zb+it.d)},fs,px)}</g>`;
    }
  }
  svg.innerHTML=s+'</g>';
  updatePad();
}

function readCandForm(){
  if(!candEdit)return;
  document.querySelectorAll('#cform [data-c]').forEach(el=>{const k=el.dataset.c;let v=el.value;if(['w','d','h','price'].includes(k))v=v===''?null:Math.round(Number(v));candEdit[k]=v});
}
function shrinkPhoto(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{const m=640,k=Math.min(1,m/Math.max(img.width,img.height)),cv=document.createElement('canvas');
      cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);res(cv.toDataURL('image/jpeg',0.72))};
    img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url;
  });
}
$('photoIn').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f||!candEdit)return;

function toMM(e){const b=svg.getBoundingClientRect();return {x:(e.clientX-b.left-V.tx)/V.s,y:(e.clientY-b.top-V.ty)/V.s}}
function fit(){

    const g=SG(c);

    V.tx=(b.width-g.W*V.s)/2+25;V.ty=55;renderShelf();return}
  const r=room(),pad=T+700;w=r.w+pad*2;h=r.d+pad*2;
  V.s=Math.max(0.01,Math.min((b.width-20)/w,(b.height-20)/h));

const renderView=()=>UI.mode==='shelf'?renderShelf():renderCanvas();
function pickNear(v,c,th){let b=v,bd=th;c.forEach(t=>{const d=Math.abs(t-v);if(d<=bd){bd=d;b=t}});return b}
function magnet(it,nx,ny){
  const r=room(),a=sel.k==='f'?fp(it):ob(it),w=a.w,h=a.h,th=12/V.s,O=rects(it.id);
  const cx=[0,r.w-w];O.forEach(o=>{if(o.y<ny+h-0.5&&ny<o.y+o.h-0.5)cx.push(o.x+o.w,o.x-w)});
  nx=pickNear(nx,cx,th);
  const cy=[0,r.d-h];O.forEach(o=>{if(o.x<nx+w-0.5&&nx<o.x+o.w-0.5)cy.push(o.y+o.h,o.y-h)});
  ny=pickNear(ny,cy,th);
  return [nx,ny];
}
function wallDrag(it,m){
  const r=room(),cand=[['top',Math.abs(m.y)],['bottom',Math.abs(m.y-r.d)],['left',Math.abs(m.x)],['right',Math.abs(m.x-r.w)]].sort((a,b)=>a[1]-b[1]);
  const wall=cand[0][0],W=WI(r,wall),w=fixW(it);

}
function levelAt(c,g,yScreen){const Yb=g.Ht-yScreen;for(let i=0;i<c.sh.levels.length;i++){if(Yb>=g.base[i]-g.t/2&&Yb<g.base[i]+c.sh.levels[i].h+g.t/2)return i}return Yb<g.base[0]?0:c.sh.levels.length-1}

svg.addEventListener('pointermove',e=>{

  if(drag.type==='pan'){if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>6)drag.tap=false;V.tx=drag.tx+e.clientX-drag.sx;V.ty=drag.ty+e.clientY-drag.sy;renderView();return}
  const it=selItem();if(!it)return;const m=toMM(e);
  if(drag.type==='wall'){if(wallDrag(it,m)){drag.moved=true;renderCanvas()}return}
  if(drag.type==='move'){
    let nx=s10(drag.ox+m.x-drag.sx),ny=s10(drag.oy+m.y-drag.sy);

    if(nx!==it.x||ny!==it.y){it.x=r1(nx);it.y=r1(ny);drag.moved=true;renderCanvas()}

  }
  // 棚
  const c=shelfCtx(),g=SG(c);let f=findShelfItem(c,it.id);const th=12/V.s;
  const sub=subtree(f.lv,it.id);
  const lims=lv=>{const xs=[0,g.iw-it.w];(lv.parts||[]).forEach(p=>xs.push(p-it.w,p+g.t));return xs};
  if(drag.type==='sfront'){
    // 段の移動
    const li=levelAt(c,g,m.y-drag.grabDy-1);
    if(li!==f.li){moveToLevel(c,f.li,li,sub);it.on=null;f=findShelfItem(c,it.id);UI.level=li}
    const lv=f.lv;
    let nx=s10(drag.ox+m.x-drag.sx);
    const xs=lims(lv);lv.items.forEach(o=>{if(!sub.has(o.id)&&o.zb<it.zb+it.d-0.5&&it.zb<o.zb+o.d-0.5)xs.push(o.x+o.w,o.x-it.w)});
    nx=pickNear(nx,xs,th);

    const top=g.Ht-g.base[f.li]-lv.h,rawBottom=top+lv.h-(m.y-drag.grabDy);
    let on=null,best=-1;
    lv.items.forEach(o=>{if(sub.has(o.id))return;if(!(o.x<nx+it.w-0.5&&nx<o.x+o.w-0.5))return;const tp=itemY(lv,o)+o.h;if(rawBottom>=tp-o.h/2&&tp>best){best=tp;on=o}});
    const dx=nx-it.x;
    sub.forEach(id=>{const o=lv.items.find(q=>q.id===id);if(o&&id!==it.id)o.x+=dx});
    it.x=nx;
    if(on){if(it.on!==on.id){const dz=on.zb-it.zb;sub.forEach(id=>{const o=lv.items.find(q=>q.id===id);if(o)o.zb+=dz})}it.on=on.id}else it.on=null;
    drag.moved=true;renderShelf();return;
  }
  if(drag.type==='stop'){
    const lv=f.lv;let nx=s10(drag.ox+m.x-drag.sx),nz=s10(drag.oz+m.y-drag.sy);
    const Y=itemY(lv,it),same=o=>!sub.has(o.id)&&itemY(lv,o)<Y+it.h-0.5&&Y<itemY(lv,o)+o.h-0.5;
    const xs=lims(lv);lv.items.forEach(o=>{if(same(o)&&o.zb<nz+it.d-0.5&&nz<o.zb+o.d-0.5)xs.push(o.x+o.w,o.x-it.w)});nx=pickNear(nx,xs,th);
    const zs=[0,g.idp-it.d];lv.items.forEach(o=>{if(same(o)&&o.x<nx+it.w-0.5&&nx<o.x+o.w-0.5)zs.push(o.zb+o.d,o.zb-it.d)});nz=Math.max(0,pickNear(nz,zs,th));
    const dx=nx-it.x,dz=nz-it.zb;sub.forEach(id=>{const o=lv.items.find(q=>q.id===id);if(o){o.x+=dx;o.zb+=dz}});

    drag.moved=true;renderShelf();return;
  }
});

  async addShelfS(){const n=await ask('棚の名前（例：押入れ上段、キッチン吊り戸棚）','押入れ');if(!n||!n.trim())return;
    const s={id:uid(),name:n.trim(),w:900,d:400,h:1800,shelf:null};s.shelf=defaultShelf(s.h);S.shelves.push(s);UI.shelfRef={t:'s',id:s.id};UI.level=s.shelf.levels.length-1;sel=null;commit();requestAnimationFrame(fit)},
  async delShelfS(){const c=shelfCtx();if(!c||c.linked)return;if(!await confirmBox(`「${c.holder.name}」を削除しますか？`))return;S.shelves=S.shelves.filter(s=>s!==c.holder);UI.shelfRef=null;sel=null;commit();requestAnimationFrame(fit)},
  async delShelfLink(){const c=shelfCtx();if(!c||!c.linked)return;if(!await confirmBox(`「${c.holder.name}」の棚の中のデータ（段・置いた物）を削除しますか？\n家具そのものは残ります。`))return;delete c.holder.shelf;UI.shelfRef=null;sel=null;commit();requestAnimationFrame(fit)},
  addLevel(){const c=shelfCtx();if(!c)return;c.sh.levels.push({h:300,parts:[],items:[]});UI.level=c.sh.levels.length-1;commit()},
  async delLevel(el){const c=shelfCtx(),i=Number(el.dataset.i);if(!c||c.sh.levels.length<2){note('段が1つしかないため削除できません');return}
    const lv=c.sh.levels[i];if(lv.items.length&&!await confirmBox(`${lvName(c,i)}には物が${lv.items.length}個あります。段ごと削除しますか？`))return;
    c.sh.levels.splice(i,1);UI.level=Math.min(UI.level,c.sh.levels.length-1);sel=null;commit()},
  selLv(el){UI.level=Number(el.dataset.i);sel=null;render()},
  addItem(){const c=shelfCtx();if(!c)return;addShelfItem(c,UI.level,{name:'かご'+(c.sh.levels[UI.level].items.length+1),w:250,d:350,h:250});commit()},
  unstack(){const it=selItem();if(it){it.on=null;commit()}},
  // 候補
  cfilter(el){UI.cfilter=el.dataset.k;render()},
  candNew(){candEdit={isNew:true,id:uid(),name:'',kind:'small',w:null,d:null,h:null,price:null,store:'',memo:'',status:'cand',photo:null};renderCands();window.scrollTo(0,0);$('candView').scrollTop=0},
  candEditBtn(el){const x=S.cands.find(c=>c.id===el.dataset.id);if(!x)return;candEdit={...x,isNew:false};renderCands();$('candView').scrollTop=0;window.scrollTo(0,0)},
  candCancel(){candEdit=null;renderCands()},
  photoPick(){readCandForm();$('photoIn').click()},
  photoDel(){readCandForm();candEdit.photoData=null;candEdit.photo=null;renderCands()},
  async candSave(){
    readCandForm();const e=candEdit;
    if(!String(e.name||'').trim()){note('名前を入れてください。');return}
    const o={id:e.id,name:e.name.trim(),kind:e.kind,w:e.w,d:e.d,h:e.h,price:e.price,store:e.store||'',memo:e.memo||'',status:e.status,photo:e.photo||null,at:e.at||Date.now()};
    if(e.photoData){const pid=uid();PHOTOS[pid]=e.photoData;o.photo=pid;await savePhotos()}
    const i=S.cands.findIndex(c=>c.id===o.id);if(i>=0)S.cands[i]=o;else S.cands.push(o);
    candEdit=null;commit();
  },
  async candDel(){if(!await confirmBox(`「${candEdit.name}」を削除しますか？`))return;S.cands=S.cands.filter(c=>c.id!==candEdit.id);candEdit=null;commit()},
  candToPlan(el){
    const x=S.cands.find(c=>c.id===el.dataset.id);if(!x)return;
    if(!x.w||!x.d){note('幅と奥行きを入れてから置いてください。');return}
    const [px,py]=center(x.w,x.d),f={id:uid(),name:x.name,w:x.w,d:x.d,h:x.h||0,color:COLORS[cnt()%COLORS.length],x:px,y:py,rot:0};
    plan().furniture.push(f);UI.mode='plan';sel={k:'f',id:f.id};commit();requestAnimationFrame(fit);
    note(`「${room().name}」の「${plan().name}」に置きました。\n別の部屋や配置案に置きたいときは、先に間取りでその部屋・案を開いてから押してください。`);
  },
  async candToShelf(el){
    const x=S.cands.find(c=>c.id===el.dataset.id);if(!x)return;
    if(!x.w||!x.d||!x.h){note('幅・奥行き・高さを入れてから置いてください。');return}
    const L=shelfList();if(!L.length){note('棚がまだありません。「棚」画面で先に棚を作ってください。');return}
    let c=shelfCtx();
    if(L.length>1){const i=await choose(`「${x.name}」をどの棚に置きますか？`,L.map(q=>q.label));if(i===null)return;c=L[i];UI.shelfRef=c.ref;UI.level=c.sh.levels.length-1}
    const li=await choose('どの段に置きますか？',c.sh.levels.map((_,i)=>lvName(c,i)).reverse());if(li===null)return;
    addShelfItem(c,c.sh.levels.length-1-li,{name:x.name,w:x.w,d:x.d,h:x.h});
    UI.mode='shelf';commit();requestAnimationFrame(fit);
  },
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;if(el.tagName==='A')e.preventDefault();const f=ACTS[el.dataset.act];if(f)f(el)});
$('fileIn').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  const rd=new FileReader();
  rd.onload=async()=>{
    e.target.value='';
    let d;try{d=JSON.parse(rd.result);if(!Array.isArray(d.rooms)||!d.rooms.length)throw 0}catch(err){note('このファイルは読み込めませんでした。');return}
    if(!await confirmBox('今の内容を、読み込んだファイルの内容に置き換えます。よろしいですか？\n（「元に戻す」で戻せます）'))return;
    if(d.photos&&typeof d.photos==='object'){Object.assign(PHOTOS,d.photos);await savePhotos()}
    delete d.photos;S=migrate(d);S.cur=0;sel=null;UI.shelfRef=null;commit();if(UI.mode!=='cand')fit();
  };
  rd.readAsText(file);
});

/* ---------- クラウド同期（Claudeのリンクで開いたときだけ） ---------- */
const setCloud=t=>{$('cloud').textContent=t};
async function pushCloud(){
  if(!cloud)return;if(cloudBusy){cloudDirty=true;return}
  cloudBusy=true;
  try{await cloud.set({json:JSON.stringify(S),at:localAt,dev:DEV});setCloud('☁ 同期済み')}
  catch(e){setCloud('☁ 同期できませんでした（この端末には保存済み）')}
  cloudBusy=false;if(cloudDirty){cloudDirty=false;pushCloud()}
}
function applyRemote(d){
  if(drag){pendingRemote=d;return}
  let n;try{n=JSON.parse(d.json)}catch(e){return}
  if(!n||!Array.isArray(n.rooms)||!n.rooms.length)return;
  hist.push(snap);fut=[];S=migrate(n);snap=JSON.stringify(S);localAt=d.at;save();
  try{localStorage.setItem(KEY+'_at',String(localAt))}catch(e){}
  if(!selItem())sel=null;render();setCloud('☁ 他の端末の変更を反映しました');
}
async function initCaps(){
  let tries=0;while(!(window.claude&&typeof window.claude.use==='function')){if(++tries>20)return;await new Promise(r=>setTimeout(r,150))}
  CAP.inArtifact=true;
  try{CAP.downloads=await window.claude.use('downloads')}catch(e){}
  let db=null,user=null;
  try{db=await window.claude.use('db');user=await window.claude.use('user')}catch(e){}
  if(!db||!user)return;
  let id=null;try{id=await user.id()}catch(e){}
  if(!id)return;
  try{cloud=db.doc('data/users/'+id+'/state')}catch(e){cloud=null;return}
  setCloud('☁ 接続中…');
  const tm=setTimeout(()=>setCloud('☁ つながりません（この端末には保存済み）'),10000);
  cloud.onSnapshot(sn=>{
    if(!sn.metadata.fromCache)clearTimeout(tm);
    if(!sn.exists){if(!sn.metadata.fromCache){if(localAt>0)pushCloud();else setCloud('☁ 同期済み')}return}
    const d=sn.data()||{};
    if(d.dev===DEV)return;
    if(typeof d.at==='number'&&d.at>localAt)applyRemote(d);
    else if(!sn.metadata.fromCache){if(d.at<localAt)pushCloud();else setCloud('☁ 同期済み')}
  },()=>{clearTimeout(tm);cloud=null;setCloud('')});
}

/* ---------- 起動 ---------- */
(async function boot(){
  let txtS=null,ph=null;
  try{await IDB.open();txtS=await IDB.get('state');ph=await IDB.get('photos')}catch(e){IDB.db=null}
  if(!txtS){try{txtS=localStorage.getItem(KEY)}catch(e){}}
  try{S=JSON.parse(txtS)}catch(e){S=null}
  if(!S||!Array.isArray(S.rooms)||!S.rooms.length)S=sample();
  S=migrate(S);PHOTOS=ph&&typeof ph==='object'?ph:{};
  // 使われていない写真を片付ける
  const used=new Set(S.cands.map(c=>c.photo).filter(Boolean));let rm=false;
  Object.keys(PHOTOS).forEach(k=>{if(!used.has(k)){delete PHOTOS[k];rm=true}});if(rm)savePhotos();
  snap=JSON.stringify(S);
  if(!['plan','shelf','cand'].includes(UI.mode))UI.mode='plan';
  render();requestAnimationFrame(()=>{if(UI.mode!=='cand')fit()});
  saveNow();initCaps();
})();
