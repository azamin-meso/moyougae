<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>模様替えシミュレーター</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Meiryo","Hiragino Sans","Yu Gothic UI",sans-serif;font-size:14px;color:#222;background:#eef0f3}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#2f3e4e;color:#fff;flex-wrap:wrap}
header h1{font-size:16px;margin:0 12px 0 0;font-weight:bold}
header .sp{flex:1}
#saved,#cloud{font-size:12px;opacity:.75}
button{font:inherit;padding:4px 10px;border:1px solid #9aa5b1;background:#fff;border-radius:4px;cursor:pointer;color:#222}
button:hover{background:#e8f0fb}
header button{background:#435568;color:#fff;border-color:#62788f}
header button:hover{background:#536a82}
#modes{display:flex;background:#2f3e4e;padding:0 10px 8px;gap:6px}
#modes button{flex:1;max-width:220px;padding:8px;font-weight:bold;background:#435568;color:#dfe6ee;border-color:#62788f}
#modes button.on{background:#fff;color:#2f3e4e;border-color:#fff}
#tabs{display:flex;gap:2px;padding:6px 10px 0;background:#d5dbe2;flex-wrap:wrap}
#tabs button{border-radius:6px 6px 0 0;border-bottom:none;background:#c3cbd5}
#tabs button.on{background:#fff;font-weight:bold}
#main{flex:1;display:flex;min-height:0}
#left{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}
.bar{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid #dde2e8;flex-wrap:wrap}
.bar select{font:inherit;padding:3px;max-width:340px}
.hint{font-size:12px;color:#667}
#cvwrap{position:relative;flex:1;min-height:0;display:flex}
#cv{flex:1;width:100%;min-height:0;display:block;background:#f6f7f9;touch-action:none;user-select:none;cursor:grab}
#cv .mv{cursor:move}
#cv .hit{cursor:pointer}
#pad{position:absolute;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:4px}
#pad[hidden]{display:none}
#pad button{padding:0;font-size:18px;background:rgba(255,255,255,.92);box-shadow:0 1px 3px rgba(0,0,0,.2)}
#pad .st{font-size:11px}
aside{width:320px;overflow:auto;padding:10px 12px;background:#fafbfc;border-left:1px solid #dde2e8}
aside h3{font-size:14px;margin:14px 0 6px;padding-bottom:3px;border-bottom:2px solid #2f3e4e}
aside h3:first-child{margin-top:0}
aside label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:5px 0;font-size:13px}
aside input,aside select{font:inherit;width:140px;padding:3px 5px}
aside input[type=color]{padding:0;height:28px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.danger{color:#c0392b;border-color:#e0a9a2}
.primary{background:#1e6fd9;color:#fff;border-color:#1e6fd9;font-weight:bold}
.primary:hover{background:#185bb3}
ul.lst{list-style:none;padding:0;margin:0}
ul.lst li{padding:4px 6px;border-radius:4px;cursor:pointer;font-size:13px}
ul.lst li:hover{background:#e8f0fb}
ul.ng li.ng{color:#b42318}
ul.ng li.wn{color:#a15c00}
.ok{color:#1a7f37;font-size:13px}
.note{font-size:12px;color:#667;line-height:1.6}
.sw{display:inline-block;width:12px;height:12px;border:1px solid #555;vertical-align:-1px;margin-right:6px}
table.lv{width:100%;border-collapse:collapse;font-size:13px}
table.lv td{padding:3px 2px;border-bottom:1px solid #e3e7ec}
table.lv input{width:70px}
table.lv input.pt{width:90px}
table.lv tr.on td{background:#e8f0fb}
table.lv button{font-size:12px;padding:3px 6px;white-space:nowrap}
table.lv a{white-space:nowrap}
/* 候補リスト */
#candView{flex:1;overflow:auto;padding:12px;background:#f6f7f9}
#candView[hidden]{display:none}
.ctop{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.ctop .big{font-size:16px;padding:10px 18px}
.chip{border-radius:16px;padding:4px 12px}
.chip.on{background:#2f3e4e;color:#fff;border-color:#2f3e4e}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{background:#fff;border:1px solid #dde2e8;border-radius:8px;padding:10px;display:flex;gap:10px}
.card .ph{width:96px;height:96px;flex:none;border-radius:6px;background:#eef0f3;display:flex;align-items:center;justify-content:center;color:#99a;font-size:12px;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .bd{flex:1;min-width:0}
.card .nm{font-weight:bold;font-size:15px;margin-bottom:2px}
.card .mt{font-size:12px;color:#556;line-height:1.6}
.card .btns{margin:6px 0 0}
.card .btns button{font-size:12px;padding:4px 8px}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;margin-left:6px;vertical-align:2px;font-weight:normal}
.b-cand{background:#e8f0fb;color:#1e6fd9}.b-buy{background:#e3f4e8;color:#1a7f37}.b-skip{background:#eee;color:#777}
.form{background:#fff;border:2px solid #1e6fd9;border-radius:8px;padding:12px;margin-bottom:12px;max-width:560px}
.form label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}
.form input,.form select,.form textarea{font:inherit;width:62%;padding:5px}
.form textarea{height:60px}
.form .dims{display:flex;gap:6px;width:62%}
.form .dims input{width:33%}
.form .phbox{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.form .phbox .ph{width:120px;height:120px;border-radius:6px;background:#eef0f3;display:flex;align-items:center;justify-content:center;color:#99a;font-size:12px;overflow:hidden}
.form .phbox img{width:100%;height:100%;object-fit:cover}
#dlg,#shr{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:10}
#dlg[hidden],#shr[hidden]{display:none}
#shr .box{max-height:92vh;overflow:auto}
#shr canvas{display:block;margin:10px auto 0;width:min(100%,300px);height:auto;image-rendering:pixelated}
#dlg .box,#shr .box{background:#fff;border-radius:8px;padding:16px;width:min(92vw,380px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
#dlg .msg{white-space:pre-wrap;margin-bottom:10px;line-height:1.6}
#dlg input,#dlg select{width:100%;font-size:16px;padding:6px}
#dlg .btns{justify-content:flex-end}
#shr .msg{font-weight:bold;margin-bottom:8px}
#shr .warn{color:#a15c00}
#shrDone{color:#1a7f37;font-weight:bold;min-height:1.2em}
.mhint{display:none}
#pick{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:9}
#pick .box{background:#fff;border-radius:10px;width:min(94vw,540px);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#pick .hd{padding:12px 12px 8px;border-bottom:1px solid #e3e7ec}
#pick .hd .t{display:flex;align-items:center;gap:8px;font-weight:bold;margin-bottom:8px}
#pick .hd .t span{flex:1}
#pick .ls{overflow:auto;padding:6px 8px 12px}
.prow{display:flex;gap:10px;align-items:center;padding:8px;border-radius:6px;cursor:pointer;border-bottom:1px solid #f0f2f5}
.prow:hover{background:#e8f0fb}
.prow .ph{width:56px;height:56px;flex:none;border-radius:6px;background:#eef0f3;display:flex;align-items:center;justify-content:center;color:#99a;font-size:11px;overflow:hidden}
.prow .ph img{width:100%;height:100%;object-fit:cover}
.prow .nm{font-weight:bold}
.prow .mt{font-size:12px;color:#556}
.prow.dim{opacity:.45}
.card .btns button.dim{opacity:.5}
#sheet{display:none}
#cv .bd{cursor:ns-resize}
[hidden]{display:none!important}
@media (max-width:820px){
  html,body{height:auto;font-size:15px}
  body{min-height:100%}
  header{flex-wrap:nowrap;overflow-x:auto;padding:4px 6px;gap:4px}
  header h1,#saved,.lg{display:none}
  #cloud{white-space:nowrap}
  #modes{padding:0 6px 6px}
  button{padding:8px 10px;white-space:nowrap;flex:none}
  .bar{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;padding:4px 6px}
  #tabs{flex-wrap:nowrap;overflow-x:auto;padding:4px 6px 0}
  #main{flex-direction:column}
  #left{flex:none;height:82vh;height:82svh}
  #main.cand #left{height:auto;min-height:82svh}
  aside{width:auto;border-left:none;border-top:1px solid #dde2e8;overflow:visible}
  aside input,aside select{font-size:16px;width:170px}
  table.lv input{width:64px;font-size:16px}
  .bar select,.form input,.form select,.form textarea{font-size:16px}
  .form input,.form select,.form textarea,.form .dims{width:66%}
  .cards{grid-template-columns:1fr}
  .phint{display:none}
  .mhint{display:flex}
  #pick{align-items:flex-end}
  #pick .box{width:100%;border-radius:14px 14px 0 0;max-height:78vh;padding-bottom:env(safe-area-inset-bottom)}
  .prow{padding:10px 6px}
  #sheet{display:block;position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:1px solid #c9d1da;border-radius:14px 14px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.18);padding:0 12px calc(12px + env(safe-area-inset-bottom));max-height:72vh;overflow:auto}
  #sheet .grip{display:flex;align-items:center;gap:6px;position:sticky;top:0;background:#fff;padding:6px 0 6px;touch-action:none;z-index:1}
  #sheet .grip .ttl{font-weight:bold;font-size:14px;flex:1}
  #sheet .grip .bar{position:absolute;left:50%;top:3px;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:#c3cbd5}
  #sheet .grip button{padding:4px 12px}
  #sheet .nm input{width:100%;font-size:16px;padding:7px}
  #sheet .dims3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
  #sheet .dims3 label{display:flex;flex-direction:column;font-size:12px;color:#556;gap:2px}
  #sheet .dims3 input{width:100%;font-size:16px;padding:7px}
  #sheet .btns{margin:8px 0 0}
  #sheet .btns button{padding:8px 10px}
  #sheet .info{font-size:12px;color:#556;margin-top:2px}
  #sheet h3{font-size:14px;margin:12px 0 6px;padding-bottom:3px;border-bottom:2px solid #2f3e4e}
  #sheet label.f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0;font-size:13px}
  #sheet label.f input,#sheet label.f select{width:170px;font-size:16px;padding:5px}
  #sheet label.f input[type=color]{height:32px;padding:0}
  #pad.onsheet{position:fixed}
}
</style>
</head>
<body>
<header>
  <h1>模様替えシミュレーター</h1>
  <button data-act="undo" title="Ctrl+Z">↶<span class="lg"> 元に戻す</span></button>
  <button data-act="redo" title="Ctrl+Y">↷<span class="lg"> やり直し</span></button>
  <button data-act="fit" id="fitBtn">全体<span class="lg">表示</span></button>
  <span class="sp"></span>
  <span id="saved"></span> <span id="cloud"></span>
  <button data-act="export"><span class="lg">ファイルに</span>書き出す</button>
  <button data-act="import"><span class="lg">ファイルを</span>読み込む</button>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
</header>
<nav id="modes">
  <button data-act="mode" data-m="plan">間取り</button>
  <button data-act="mode" data-m="shelf">棚</button>
  <button data-act="mode" data-m="cand">候補リスト</button>
</nav>
<div id="tabs"></div>
<div id="main">
  <div id="left">
    <div class="bar" id="bar1"></div>
    <div class="bar" id="bar2"></div>
    <div id="cvwrap"><svg id="cv" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="pad" hidden>
        <span></span><button data-act="nudge" data-dx="0" data-dy="-1" id="padU">↑</button><button data-act="padStep" class="st" id="padStep">10mm</button>
        <button data-act="nudge" data-dx="-1" data-dy="0">←</button><button data-act="rot" id="padRot" title="90°回転">⟳</button><button data-act="nudge" data-dx="1" data-dy="0">→</button>
        <span></span><button data-act="nudge" data-dx="0" data-dy="1" id="padD">↓</button><span></span>
      </div></div>
    <div id="candView" hidden></div>
    <div class="bar hint mhint" id="mhint"></div>
    <div class="bar hint phint" id="phint"></div>
  </div>
  <aside id="panel"></aside>
</div>
<div id="sheet" hidden></div>
<div id="pick" hidden><div class="box"><div class="hd"><div class="t"><span id="pickTtl"></span><button data-act="pickClose" aria-label="閉じる">✕</button></div><div id="pickChips"></div></div><div class="ls" id="pickList"></div></div></div>
<div id="dlg" hidden><div class="box"><div class="msg" id="dlgMsg"></div><input id="dlgIn"><select id="dlgSel"></select><div class="btns"><button id="dlgCancel">キャンセル</button><button id="dlgOk" class="primary">OK</button></div></div></div>
<div id="shr" hidden><div class="box"><div class="msg" id="shrMsg"></div>
  <div class="note" id="shrFrom"></div>
  <div class="btns"><button id="shrCopy" class="primary">URLをコピー</button><button id="shrShare">共有…</button><button id="shrQR">QRコード</button></div>
  <div id="shrDone"></div><div class="note" id="shrInfo"></div><canvas id="shrCv" hidden></canvas>
  <div class="btns" style="justify-content:flex-end"><button id="shrClose">閉じる</button></div></div></div>
<input type="file" id="photoIn" accept="image/*" hidden>
<script>
'use strict';
const KEY='moyougae_v1', T=120;
const WALLS={top:'上の壁',right:'右の壁',bottom:'下の壁',left:'左の壁'};
const COLORS=['#c8a27a','#8fb3d9','#a8c98f','#e0b0c0','#d9c27a','#b0a0d0','#9fd0c8','#d99f8f'];
const svg=document.getElementById('cv'), panel=document.getElementById('panel');
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r1=v=>Math.round(v);
const s10=v=>Math.round(v/10)*10;

/* ---------- データ ---------- */
function newPlan(name){return {id:uid(),name,furniture:[]}}
function newRoom(name,w,d){const p=newPlan('案1');return {id:uid(),name,w,d,fixtures:[],plans:[p],planId:p.id}}
function sample(){
  const r=newRoom('リビング',3640,4550);
  r.fixtures.push({id:uid(),type:'door',wall:'bottom',offset:2700,width:780,kind:'hinged',hinge:'end',swing:'in',slide:'end'});
  r.fixtures.push({id:uid(),type:'window',wall:'top',offset:900,width:1690,sill:900});
  r.fixtures.push({id:uid(),type:'outlet',wall:'left',offset:1800,kind:'outlet'});
  r.fixtures.push({id:uid(),type:'obstacle',name:'柱',x:3340,y:0,w:300,d:300});
  const p=r.plans[0];p.name='案1：今の配置';
  p.furniture.push({id:uid(),name:'ソファ',w:1800,d:850,h:800,color:COLORS[0],x:200,y:3500,rot:0});
  p.furniture.push({id:uid(),name:'テレビ台',w:1500,d:400,h:450,color:COLORS[1],x:0,y:1100,rot:1});
  return {version:2,rooms:[r],cur:0,shelves:[],cands:[]};
}
function migrate(d){
  d.version=2;if(!Array.isArray(d.shelves))d.shelves=[];if(!Array.isArray(d.cands))d.cands=[];
  if(!(d.cur>=0&&d.cur<d.rooms.length))d.cur=0;
  return d;
}
/* ---------- 読み込むデータの検査（URL・ファイル・保存データ共通） ---------- */
const ID_RE=/^[a-z0-9]{1,20}$/i;
const num=(v,def=0,min=-1e6,max=1e6)=>{if(v===null||v===''||v===undefined)return def;v=Number(v);return isFinite(v)?Math.min(max,Math.max(min,Math.round(v))):def};
const optNum=(v,min,max)=>v===null||v===undefined||v===''?null:num(v,null,min,max);
const str=(v,max=100)=>(typeof v==='string'?v:typeof v==='number'?String(v):'').slice(0,max);
const col=v=>typeof v==='string'&&/^#[0-9a-fA-F]{6}$/.test(v)?v:COLORS[0];
const en=(v,arr,def)=>arr.includes(v)?v:def;
const idv=v=>typeof v==='string'&&ID_RE.test(v)?v:uid();
const arr=(v,n)=>Array.isArray(v)?v.slice(0,n).filter(x=>x&&typeof x==='object'&&!Array.isArray(x)):[];
function cItem(i){return {id:idv(i.id),name:str(i.name,60)||'物',w:num(i.w,250,1,20000),d:num(i.d,350,1,20000),h:num(i.h,250,1,20000),color:col(i.color),x:num(i.x,0,-20000,20000),zb:num(i.zb,0,0,20000),on:typeof i.on==='string'&&ID_RE.test(i.on)?i.on:null}}
function cShelf(sh){
  if(!sh||typeof sh!=='object')return null;const L=arr(sh.levels,30);if(!L.length)return null;
  return {t:num(sh.t,18,0,200),base:num(sh.base,0,0,2000),iw:optNum(sh.iw,10,50000),idp:optNum(sh.idp,10,50000),
    levels:L.map(l=>({h:num(l.h,300,10,5000),parts:(Array.isArray(l.parts)?l.parts:[]).slice(0,20).map(x=>num(x,0,0,50000)).filter(x=>x>0),items:arr(l.items,300).map(cItem)}))};
}
function cFurn(f){const o={id:idv(f.id),name:str(f.name,60)||'家具',w:num(f.w,900,1,50000),d:num(f.d,450,1,50000),h:num(f.h,900,0,10000),color:col(f.color),x:num(f.x,0,-100000,100000),y:num(f.y,0,-100000,100000),rot:f.rot?1:0};const sh=cShelf(f.shelf);if(sh)o.shelf=sh;return o}
function cFix(x){
  const type=en(x.type,['door','window','outlet','closet','obstacle'],null);if(!type)return null;
  if(type==='obstacle')return {id:idv(x.id),type,name:str(x.name,40)||'柱',x:num(x.x,0,-100000,100000),y:num(x.y,0,-100000,100000),w:num(x.w,300,1,100000),d:num(x.d,300,1,100000)};
  const o={id:idv(x.id),type,wall:en(x.wall,['top','right','bottom','left'],'top'),offset:num(x.offset,0,0,100000)};
  if(type==='outlet'){o.kind=en(x.kind,['outlet','switch'],'outlet');return o}
  o.width=num(x.width,780,10,50000);
  if(type==='window'){o.sill=num(x.sill,900,0,5000);return o}
  o.kind=en(x.kind,['hinged','double','sliding','hikichigai'],'hinged');o.hinge=en(x.hinge,['start','end'],'start');o.swing=en(x.swing,['in','out'],'in');o.slide=en(x.slide,['start','end'],'end');
  return o;
}
function cPlan(p){return {id:idv(p.id),name:str(p.name,60)||'案',furniture:arr(p.furniture,500).map(cFurn)}}
function cRoom(r){
  const plans=arr(r.plans,50).map(cPlan);if(!plans.length)plans.push(newPlan('案1'));
  return {id:idv(r.id),name:str(r.name,40)||'部屋',w:num(r.w,3600,100,100000),d:num(r.d,3600,100,100000),fixtures:arr(r.fixtures,300).map(cFix).filter(Boolean),plans,planId:plans.some(p=>p.id===r.planId)?r.planId:plans[0].id};
}
function cStandShelf(x){const sh=cShelf(x.shelf);if(!sh)return null;return {id:idv(x.id),name:str(x.name,40)||'棚',w:num(x.w,900,10,50000),d:num(x.d,400,10,50000),h:num(x.h,1800,10,10000),shelf:sh}}
function cCand(c){return {id:idv(c.id),name:str(c.name,80)||'候補',kind:en(c.kind,['furn','small'],'small'),w:optNum(c.w,1,50000),d:optNum(c.d,1,50000),h:optNum(c.h,1,50000),price:optNum(c.price,0,1e9),store:str(c.store,60),memo:str(c.memo,500),status:en(c.status,['cand','buy','skip'],'cand'),photo:typeof c.photo==='string'&&ID_RE.test(c.photo)?c.photo:null,at:num(c.at,Date.now(),0,1e14)}}
function sanitize(d){
  if(!d||typeof d!=='object'||!Array.isArray(d.rooms))return null;
  const rooms=arr(d.rooms,50).map(cRoom);if(!rooms.length)return null;
  return {version:2,rooms,cur:num(d.cur,0,0,rooms.length-1),shelves:arr(d.shelves,100).map(cStandShelf).filter(Boolean),cands:arr(d.cands,2000).map(cCand)};
}
const PHOTO_RE=/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/;
function cPhotos(p){const o={};if(p&&typeof p==='object')for(const [k,v] of Object.entries(p)){if(ID_RE.test(k)&&typeof v==='string'&&v.length<4e6&&PHOTO_RE.test(v))o[k]=v}return o}

let S=null,PHOTOS={};
let snap='',hist=[],fut=[];

const IDB={db:null,
  open(){return new Promise((res,rej)=>{const q=indexedDB.open('moyougae',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{this.db=q.result;res()};q.onerror=()=>rej(q.error)})},
  get(k){return new Promise((res,rej)=>{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  set(k,v){return new Promise((res,rej)=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}};

/* ---------- 画面内ダイアログ ---------- */
function dialog(msg,{input=null,options=null,cancel=true}={}){
  return new Promise(res=>{
    const d=$('dlg'),inp=$('dlgIn'),sl=$('dlgSel'),ok=$('dlgOk'),cc=$('dlgCancel');
    $('dlgMsg').textContent=msg;
    inp.hidden=input===null;inp.value=input??'';
    sl.hidden=!options;if(options)sl.innerHTML=options.map((o,i)=>`<option value="${i}">${esc(o)}</option>`).join('');
    cc.hidden=!cancel;d.hidden=false;
    if(input!==null)setTimeout(()=>inp.focus(),30);
    const done=v=>{d.hidden=true;ok.onclick=cc.onclick=inp.onkeydown=null;res(v)};
    ok.onclick=()=>done(options?Number(sl.value):input===null?true:inp.value);
    cc.onclick=()=>done(input===null&&!options?false:null);
    inp.onkeydown=e=>{if(e.key==='Enter')ok.onclick();if(e.key==='Escape')cc.onclick()};
  });
}
const ask=(m,v)=>dialog(m,{input:v}),confirmBox=m=>dialog(m),note=m=>dialog(m,{cancel:false}),choose=(m,o)=>dialog(m,{options:o});

/* ---------- 間取りの幾何 ---------- */
const fp=f=>({x:f.x,y:f.y,w:f.rot?f.d:f.w,h:f.rot?f.w:f.d});
const ob=o=>({x:o.x,y:o.y,w:o.w,h:o.d});
const box=(p,q)=>({x:Math.min(p[0],q[0]),y:Math.min(p[1],q[1]),w:Math.abs(q[0]-p[0]),h:Math.abs(q[1]-p[1])});
const hit=(a,b)=>a.x<b.x+b.w-0.5&&b.x<a.x+a.w-0.5&&a.y<b.y+b.h-0.5&&b.y<a.y+a.h-0.5;
function WI(r,wall){switch(wall){
  case 'top':return {ox:0,oy:0,tx:1,ty:0,nx:0,ny:1,L:r.w};
  case 'bottom':return {ox:0,oy:r.d,tx:1,ty:0,nx:0,ny:-1,L:r.w};
  case 'left':return {ox:0,oy:0,tx:0,ty:1,nx:1,ny:0,L:r.d};
  default:return {ox:r.w,oy:0,tx:0,ty:1,nx:-1,ny:0,L:r.d};}}
function leafs(r,x){
  const W=WI(r,x.wall),P=o=>[W.ox+W.tx*o,W.oy+W.ty*o];
  const s=(x.type==='closet'||x.swing!=='out')?1:-1,bx=W.nx*s,by=W.ny*s,L=[];
  if(x.kind==='hinged'){
    if(x.hinge==='end'){const [hx,hy]=P(x.offset+x.width);L.push({hx,hy,ax:-W.tx,ay:-W.ty,bx,by,R:x.width})}
    else{const [hx,hy]=P(x.offset);L.push({hx,hy,ax:W.tx,ay:W.ty,bx,by,R:x.width})}
  }else if(x.kind==='double'){
    const R=x.width/2;let [hx,hy]=P(x.offset);L.push({hx,hy,ax:W.tx,ay:W.ty,bx,by,R});
    [hx,hy]=P(x.offset+x.width);L.push({hx,hy,ax:-W.tx,ay:-W.ty,bx,by,R});
  }
  return {L,inside:s===1};
}
function leafBox(l){const x2=l.hx+(l.ax+l.bx)*l.R,y2=l.hy+(l.ay+l.by)*l.R;return box([l.hx,l.hy],[x2,y2])}
function hitLeaf(a,l){
  const b=leafBox(l),x0=Math.max(a.x,b.x),x1=Math.min(a.x+a.w,b.x+b.w),y0=Math.max(a.y,b.y),y1=Math.min(a.y+a.h,b.y+b.h);
  if(x1-x0<1||y1-y0<1)return false;
  const cx=Math.min(Math.max(l.hx,x0),x1),cy=Math.min(Math.max(l.hy,y0),y1);
  return Math.hypot(cx-l.hx,cy-l.hy)<l.R-1;
}
function slideBox(r,x){
  if(x.kind!=='sliding')return null;
  const W=WI(r,x.wall),a=x.slide==='end'?x.offset+x.width:x.offset-x.width,b=a+x.width,D=80;
  return box([W.ox+W.tx*a,W.oy+W.ty*a],[W.ox+W.tx*b+W.nx*D,W.oy+W.ty*b+W.ny*D]);
}
function winBox(r,x){const W=WI(r,x.wall),a=x.offset,b=a+x.width;return box([W.ox+W.tx*a,W.oy+W.ty*a],[W.ox+W.tx*b+W.nx*150,W.oy+W.ty*b+W.ny*150])}
const fixW=x=>x.type==='outlet'?0:x.width;
function rects(exceptId){
  const out=[];
  plan().furniture.forEach(f=>{if(f.id!==exceptId)out.push({id:f.id,...fp(f)})});
  room().fixtures.forEach(x=>{if(x.type==='obstacle'&&x.id!==exceptId)out.push({id:x.id,...ob(x)})});
  return out;
}
function checkPlan(){
  const r=room(),F=plan().furniture,bad=new Set(),msgs=[],nm=f=>`「${f.name}」`;
  const add=(id,t)=>{bad.add(id);msgs.push({id,t,c:'ng'})};
  F.forEach(f=>{
    const a=fp(f);
    if(a.x<-0.5||a.y<-0.5||a.x+a.w>r.w+0.5||a.y+a.h>r.d+0.5)add(f.id,`${nm(f)}が部屋からはみ出しています`);
    r.fixtures.forEach(x=>{
      if(x.type==='obstacle'&&hit(a,ob(x)))add(f.id,`${nm(f)}が${nm(x)}と重なっています`);
      if(x.type==='door'||x.type==='closet'){
        const lab=(x.type==='door'?'ドア':'収納の扉')+`（${WALLS[x.wall]}）`;
        const {L,inside}=leafs(r,x);
        if(inside&&L.some(l=>hitLeaf(a,l)))add(f.id,`${nm(f)}が${lab}の開く範囲にかかっています`);
        const sb=slideBox(r,x);if(sb&&hit(a,sb))add(f.id,`${nm(f)}が${lab}の引き込み範囲にかかっています`);
      }
      if(x.type==='window'&&hit(a,winBox(r,x))&&f.h>x.sill)add(f.id,`${nm(f)}（高さ${f.h}）が窓（${WALLS[x.wall]}、腰高${x.sill}）にかかっています`);
    });
  });
  for(let i=0;i<F.length;i++)for(let j=i+1;j<F.length;j++)
    if(hit(fp(F[i]),fp(F[j]))){bad.add(F[j].id);add(F[i].id,`${nm(F[i])}と${nm(F[j])}が重なっています`)}
  return {bad,warn:new Set(),msgs};
}

/* ---------- 棚 ---------- */
function defaultShelf(H){
  const t=18,n=Math.max(1,Math.min(8,Math.round((H-t)/350)));
  const h=Math.max(10,Math.floor((H-t*(n+1))/n));
  const sh={t,base:0,iw:null,idp:null,levels:Array.from({length:n},()=>({h,parts:[],items:[]}))};
  normShelf({h:H},sh);return sh;
}
function shelfList(){
  const L=[];
  S.rooms.forEach(r=>r.plans.forEach(p=>p.furniture.forEach(f=>{if(f.shelf)L.push({ref:{t:'f',r:r.id,p:p.id,f:f.id},label:`${r.name}／${p.name}／${f.name}`,holder:f,sh:f.shelf,linked:true,room:r,plan:p})})));
  S.shelves.forEach(s=>L.push({ref:{t:'s',id:s.id},label:`${s.name}（単独）`,holder:s,sh:s.shelf,linked:false}));
  return L;
}
const refKey=r=>!r?'':r.t==='f'?`f:${r.r}:${r.p}:${r.f}`:`s:${r.id}`;
function shelfCtx(){
  const L=shelfList();let c=L.find(x=>refKey(x.ref)===refKey(UI.shelfRef));
  if(!c&&L.length){c=L[0];UI.shelfRef=c.ref}
  if(c){if(!(UI.level>=0&&UI.level<c.sh.levels.length))UI.level=Math.max(0,c.sh.levels.length-1)}
  return c||null;
}
function SG(c){
  const sh=c.sh,t=sh.t,iw=sh.iw||Math.max(10,c.holder.w-2*t),idp=sh.idp||c.holder.d,base=[],pl=sh.base||0;
  let y=pl+t;sh.levels.forEach(lv=>{base.push(y);y+=lv.h+t});
  return {t,iw,idp,base,Ht:y,W:iw+2*t,pl};
}
// 外寸の高さに段の合計を合わせる（差はいちばん上の段から順に吸収）
function normShelf(holder,sh){
  const n=sh.levels.length;if(!n)return;
  let diff=holder.h-(sh.base||0)-sh.t*(n+1)-sh.levels.reduce((a,l)=>a+l.h,0);
  for(let i=n-1;i>=0&&diff!==0;i--){const lv=sh.levels[i],nh=Math.max(10,lv.h+diff);diff-=nh-lv.h;lv.h=nh}
}
function normAll(){if(S)shelfList().forEach(c=>normShelf(c.holder,c.sh))}
const lvName=(c,li)=>`上から${c.sh.levels.length-li}段目`;
function itemY(lv,it,d=0){if(!it.on||d>20)return 0;const b=lv.items.find(o=>o.id===it.on);return b?itemY(lv,b,d+1)+b.h:0}
function subtree(lv,id){const s=new Set([id]);let grow=true;while(grow){grow=false;lv.items.forEach(o=>{if(o.on&&s.has(o.on)&&!s.has(o.id)){s.add(o.id);grow=true}})}return s}
function findShelfItem(c,id){for(let li=0;li<c.sh.levels.length;li++){const lv=c.sh.levels[li],it=lv.items.find(o=>o.id===id);if(it)return {lv,li,it}}return null}
function checkShelf(c){
  const g=SG(c),bad=new Set(),warn=new Set(),msgs=[];
  c.sh.levels.forEach((lv,li)=>{
    const nm=lvName(c,li);
    lv.items.forEach(it=>{
      const Y=itemY(lv,it),q=`「${it.name}」`;
      const ng=t=>{bad.add(it.id);msgs.push({id:it.id,t,c:'ng'})};
      if(Y+it.h>lv.h+0.5)ng(`${q}が${nm}の高さを${r1(Y+it.h-lv.h)}mm超えています`);
      if(it.x<-0.5||it.x+it.w>g.iw+0.5)ng(`${q}が棚の幅からはみ出しています`);
      (lv.parts||[]).forEach(p=>{if(it.x<p+g.t-0.5&&it.x+it.w>p+0.5)ng(`${q}が仕切りにかかっています`)});
      if(it.zb+it.d>g.idp+0.5){warn.add(it.id);msgs.push({id:it.id,t:`${q}が手前に${r1(it.zb+it.d-g.idp)}mm飛び出しています`,c:'wn'})}
    });
    for(let i=0;i<lv.items.length;i++)for(let j=i+1;j<lv.items.length;j++){
      const a=lv.items[i],b=lv.items[j],ya=itemY(lv,a),yb=itemY(lv,b);
      if(a.x<b.x+b.w-0.5&&b.x<a.x+a.w-0.5&&a.zb<b.zb+b.d-0.5&&b.zb<a.zb+a.d-0.5&&ya<yb+b.h-0.5&&yb<ya+a.h-0.5){bad.add(a.id);bad.add(b.id);msgs.push({id:a.id,t:`「${a.name}」と「${b.name}」が重なっています（${nm}）`,c:'ng'})}
    }
  });
  const g2=SG(c);if(Math.abs(g2.Ht-c.holder.h)>0.5)msgs.push({id:null,t:`段の数が多すぎて、外寸の高さ（${c.holder.h}mm）に収まりません。棚板を抜くか、板の厚みを見直してください`,c:'wn'});
  return {bad,warn,msgs};
}

function selItem(){
  if(!sel)return null;
  if(UI.mode==='plan'){if(sel.k==='f')return plan().furniture.find(f=>f.id===sel.id);return room().fixtures.find(x=>x.id===sel.id)}
  if(UI.mode==='shelf'){const c=shelfCtx();if(!c)return null;const f=findShelfItem(c,sel.id);return f?f.it:null}
  return null;
}

function txt(x,y,s,fs,extra=''){return `<text x="${x}" y="${y}" font-size="${fs}" text-anchor="middle" dominant-baseline="middle" paint-order="stroke" stroke="#fff" stroke-width="${fs*0.25}" ${extra}>${esc(s)}</text>`}
function arcPath(l){
  const C=[l.hx+l.ax*l.R,l.hy+l.ay*l.R],E=[l.hx+l.bx*l.R,l.hy+l.by*l.R];
  let d=Math.atan2(E[1]-l.hy,E[0]-l.hx)-Math.atan2(C[1]-l.hy,C[0]-l.hx);
  while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
  return {C,E,sweep:d>0?1:0};
}
function drawWallFix(r,x,isSel,fs,px){
  const W=WI(r,x.wall),P=o=>[W.ox+W.tx*o,W.oy+W.ty*o],p0=P(x.offset);
  const selStroke=isSel?`stroke="#1e6fd9" stroke-width="${3*px}"`:`stroke="#333" stroke-width="${px}"`;
  if(x.type==='outlet'){
    const c=[p0[0]+W.nx*70,p0[1]+W.ny*70];
    return `<g data-k="x" data-id="${x.id}" class="mv"><circle cx="${c[0]}" cy="${c[1]}" r="${Math.max(60,9*px)}" fill="#fff" ${selStroke}/>${txt(c[0],c[1],x.kind==='switch'?'ス':'コ',Math.max(80,11*px),'font-weight="bold" fill="#333"')}</g>`;
  }
  const p1=P(x.offset+x.width),op=box([p0[0]-W.nx*T,p0[1]-W.ny*T],p1);
  let s=`<g data-k="x" data-id="${x.id}" class="mv">`;
  if(x.type==='window'){
    const m0=[p0[0]-W.nx*T/2,p0[1]-W.ny*T/2],m1=[p1[0]-W.nx*T/2,p1[1]-W.ny*T/2];
    s+=`<rect x="${op.x}" y="${op.y}" width="${op.w}" height="${op.h}" fill="#d6ecff" ${selStroke}/>`;
    s+=`<line x1="${m0[0]}" y1="${m0[1]}" x2="${m1[0]}" y2="${m1[1]}" stroke="#4a90d9" stroke-width="${2*px}"/>`;
    const c=P(x.offset+x.width/2);
    s+=txt(c[0]+W.nx*fs*1.1,c[1]+W.ny*fs*1.1,`窓 腰高${x.sill}`,fs*0.85,'fill="#2a6db0"');
    return s+'</g>';
  }
  s+=`<rect x="${op.x}" y="${op.y}" width="${op.w}" height="${op.h}" fill="#fafafa" ${selStroke}/>`;
  const col=x.type==='door'?'#e07b00':'#7a4fb5';
  if(x.kind==='hinged'||x.kind==='double'){
    leafs(r,x).L.forEach(l=>{
      const {C,E,sweep}=arcPath(l);
      s+=`<path d="M${l.hx} ${l.hy}L${C[0]} ${C[1]}A${l.R} ${l.R} 0 0 ${sweep} ${E[0]} ${E[1]}Z" fill="${col}" fill-opacity=".10" stroke="${col}" stroke-width="${px}" stroke-dasharray="${4*px} ${3*px}"/>`;
      s+=`<line x1="${l.hx}" y1="${l.hy}" x2="${E[0]}" y2="${E[1]}" stroke="${col}" stroke-width="${3*px}"/>`;
    });
  }else if(x.kind==='sliding'){
    const b=slideBox(r,x);
    s+=`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="${col}" fill-opacity=".18" stroke="${col}" stroke-width="${px}" stroke-dasharray="${4*px} ${3*px}"/>`;
    const q0=[p0[0]+W.nx*30,p0[1]+W.ny*30],q1=[p1[0]+W.nx*30,p1[1]+W.ny*30];
    s+=`<line x1="${q0[0]}" y1="${q0[1]}" x2="${q1[0]}" y2="${q1[1]}" stroke="${col}" stroke-width="${3*px}"/>`;
  }else{
    const h=x.width/2;
    [[0,h+50,-30],[h-50,x.width,-80]].forEach(([a,b,o])=>{const q0=P(x.offset+a),q1=P(x.offset+b);
      s+=`<line x1="${q0[0]+W.nx*o}" y1="${q0[1]+W.ny*o}" x2="${q1[0]+W.nx*o}" y2="${q1[1]+W.ny*o}" stroke="${col}" stroke-width="${3*px}"/>`});
  }

function dimLine(x1,y1,x2,y2,d,fs,px,col='#1e6fd9',label=null){

  return s+txt(mx+(vert?fs*1.8:0),my-(vert?0:fs*0.8),label??r1(d),fs*0.9,`fill="${col}" font-weight="bold"`);

function distances(a,O,bounds,fs,px){

  b=bounds.x0;O.forEach(o=>{if(oy(o)&&o.x+o.w<=a.x+0.5)b=Math.max(b,o.x+o.w)});if(a.x-b>0.5)s+=dimLine(b,cy,a.x,cy,a.x-b,fs,px);
  b=bounds.x1;O.forEach(o=>{if(oy(o)&&o.x>=a.x+a.w-0.5)b=Math.min(b,o.x)});if(b-a.x-a.w>0.5)s+=dimLine(a.x+a.w,cy,b,cy,b-a.x-a.w,fs,px);

  b=bounds.y1;O.forEach(o=>{if(ox(o)&&o.y>=a.y+a.h-0.5)b=Math.min(b,o.y)});if(b-a.y-a.h>0.5)s+=dimLine(cx,a.y+a.h,cx,b,b-a.y-a.h,fs,px);

/* ---------- クラウド同期（Claudeのリンクで開いたときだけ） ---------- */
const setCloud=t=>{$('cloud').textContent=t};
async function pushCloud(){
  if(!cloud)return;if(cloudBusy){cloudDirty=true;return}
  cloudBusy=true;
  try{await cloud.set({json:JSON.stringify(S),at:localAt,dev:DEV});setCloud('☁ 同期済み')}
  catch(e){setCloud('☁ 同期できませんでした（この端末には保存済み）')}
  cloudBusy=false;if(cloudDirty){cloudDirty=false;pushCloud()}
}
function applyRemote(d){
  if(drag){pendingRemote=d;return}
  let n;try{n=sanitize(JSON.parse(d.json))}catch(e){return}
  if(!n)return;
  hist.push(snap);fut=[];S=migrate(n);snap=JSON.stringify(S);localAt=d.at;save();
  try{localStorage.setItem(KEY+'_at',String(localAt))}catch(e){}
  if(!selItem())sel=null;render();setCloud('☁ 他の端末の変更を反映しました');
}
async function initCaps(){
  let tries=0;while(!(window.claude&&typeof window.claude.use==='function')){if(++tries>20)return;await new Promise(r=>setTimeout(r,150))}
  CAP.inArtifact=true;
  try{CAP.downloads=await window.claude.use('downloads')}catch(e){}
  let db=null,user=null;
  try{db=await window.claude.use('db');user=await window.claude.use('user')}catch(e){}
  if(!db||!user)return;
  let id=null;try{id=await user.id()}catch(e){}
  if(!id)return;
  try{cloud=db.doc('data/users/'+id+'/state')}catch(e){cloud=null;return}
  setCloud('☁ 接続中…');
  const tm=setTimeout(()=>setCloud('☁ つながりません（この端末には保存済み）'),10000);
  cloud.onSnapshot(sn=>{
    if(!sn.metadata.fromCache)clearTimeout(tm);
    if(!sn.exists){if(!sn.metadata.fromCache){if(localAt>0)pushCloud();else setCloud('☁ 同期済み')}return}
    const d=sn.data()||{};
    if(d.dev===DEV)return;
    if(typeof d.at==='number'&&d.at>localAt)applyRemote(d);
    else if(!sn.metadata.fromCache){if(d.at<localAt)pushCloud();else setCloud('☁ 同期済み')}
  },()=>{clearTimeout(tm);cloud=null;setCloud('')});
}

/* ---------- URLで送る・受け取る ---------- */
let booted=false;
const b64u=bytes=>{let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const ub64u=t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b};
async function packStr(str){
  const raw=new TextEncoder().encode(str);
  if(typeof CompressionStream==='function'){try{const cs=new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));return 'z'+b64u(new Uint8Array(await new Response(cs).arrayBuffer()))}catch(e){}}
  return 'u'+b64u(raw);
}
async function unpackStr(t){
  const k=t[0],b=ub64u(t.slice(1));
  if(k==='u')return new TextDecoder().decode(b);
  if(k==='z'){const ds=new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'));const out=await new Response(ds).arrayBuffer();if(out.byteLength>3e6)throw 0;return new TextDecoder().decode(out)}
  throw 0;
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){}
  const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();return ok;
}
async function openShare(title,body,extra=''){
  if(location.protocol==='file:'){note('PCに保存したファイルから開いているため、URLで送れません。\nGitHubのURL（○○.github.io/moyougae/）から開いて使ってください。');return}
  if(!UI.myName){const n=await ask('送り主として表示する名前を入れてください（ニックネームで十分です。例：パパ、ママ）','');if(!n||!n.trim())return;UI.myName=n.trim().slice(0,20);saveUI()}
  const url=location.origin+location.pathname+'#s='+await packStr(JSON.stringify({v:1,from:UI.myName,...body}));
  const bytes=new TextEncoder().encode(url).length;
  $('shrMsg').textContent=title+' をURLで送る';
  $('shrFrom').innerHTML=`送り主：${esc(UI.myName)}　<a href="#" id="shrName">名前を変える</a>`;
  let info=`URLの長さ：${url.length.toLocaleString()}文字。`;
  if(url.length>2000)info+=`<br><span class="warn">Discord（無料）は1メッセージ2000文字までなので、Discordにはそのまま貼れません。LINEなら送れます。長すぎる場合は「書き出す」でファイルにして送ってください。</span>`;
  if(extra)info+='<br>'+esc(extra);
  info+='<br>受け取った人がURLを開くと、確認のあと追加されます（相手のデータは上書きされません）。URLには配置の情報がそのまま入っているので、DM（個別のメッセージ）で送ってください。';
  $('shrInfo').innerHTML=info;$('shrDone').textContent='';$('shrCv').hidden=true;
  $('shrShare').hidden=!navigator.share;
  const canQR=bytes<=2900;$('shrQR').disabled=!canQR;$('shrQR').title=canQR?'':'長すぎてQRコードにできません';
  $('shrCopy').onclick=async()=>{$('shrDone').textContent=await copyText(url)?'✓ コピーしました。Discordなどに貼り付けてください。':'コピーできませんでした。'};
  $('shrShare').onclick=async()=>{try{await navigator.share({title:'模様替えシミュレーター',text:title,url})}catch(e){}};
  $('shrQR').onclick=()=>{const q=QR.encode(new TextEncoder().encode(url));if(!q){$('shrDone').textContent='長すぎてQRコードにできません。';return}drawQR($('shrCv'),q);$('shrCv').hidden=false;$('shrDone').textContent='スマホのカメラで読み取ってください。'};
  $('shrClose').onclick=()=>{$('shr').hidden=true};
  $('shrName').onclick=async e=>{e.preventDefault();$('shr').hidden=true;const n=await ask('送り主として表示する名前',UI.myName);if(n&&n.trim()){UI.myName=n.trim().slice(0,20);saveUI()}openShare(title,body,extra)};
  $('shr').hidden=false;
}
function drawQR(cv,q){
  const sc=Math.max(2,Math.floor(300/(q.size+8)));cv.width=cv.height=(q.size+8)*sc;
  const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.fillStyle='#000';
  for(let y=0;y<q.size;y++)for(let x=0;x<q.size;x++)if(q.M[y][x])g.fillRect((x+4)*sc,(y+4)*sc,sc,sc);
}
async function receiveFromHash(){
  if(!booted)return;
  const h=location.hash;if(!h.startsWith('#s='))return;
  history.replaceState(null,'',location.pathname+location.search);
  let p;try{p=JSON.parse(await unpackStr(h.slice(3)))}catch(e){note('このURLは読み込めませんでした。');return}
  if(!p||typeof p!=='object'){note('このURLは読み込めませんでした。');return}
  const from=str(p.from,20)||'だれか';
  if(p.k==='plan'&&p.room&&typeof p.room==='object'&&p.plan&&typeof p.plan==='object'){
    const rm=cRoom({...p.room,plans:[p.plan]}),pl=rm.plans[0];
    pl.id=uid();pl.furniture.forEach(f=>f.id=uid());
    if(!await confirmBox(`「${from}」から配置案「${pl.name}」（${rm.name}）が届きました。\n追加しますか？（今のデータは上書きされません）`))return;
    pl.name=`${pl.name}（${from}から）`.slice(0,60);
    const r=S.rooms.find(x=>x.id===rm.id);
    if(r){r.plans.push(pl);r.planId=pl.id;S.cur=S.rooms.indexOf(r)}else{rm.plans=[pl];rm.planId=pl.id;S.rooms.push(rm);S.cur=S.rooms.length-1}
    UI.mode='plan';sel=null;commit();requestAnimationFrame(fit);return;
  }
  if(p.k==='shelf'&&p.shelf&&typeof p.shelf==='object'){
    const s=cStandShelf(p.shelf);if(!s){note('このURLは読み込めませんでした。');return}
    if(!await confirmBox(`「${from}」から棚「${s.name}」が届きました。\n追加しますか？`))return;
    s.id=uid();s.name=`${s.name}（${from}から）`.slice(0,40);S.shelves.push(s);
    UI.shelfRef={t:'s',id:s.id};UI.level=s.shelf.levels.length-1;UI.mode='shelf';sel=null;commit();requestAnimationFrame(fit);return;
  }
  if(p.k==='cand'&&p.cand&&typeof p.cand==='object'){
    const c=cCand(p.cand);
    if(!await confirmBox(`「${from}」から候補「${c.name}」が届きました。\n候補リストに追加しますか？`))return;
    c.id=uid();c.photo=null;c.at=Date.now();c.memo=((c.memo?c.memo+'\n':'')+`（${from}から）`).slice(0,500);S.cands.push(c);
    UI.mode='cand';sel=null;commit();return;
  }
  note('このURLは読み込めませんでした。');
}

const QR=(()=>{
  const ECC={L:[-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
             M:[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28]};
  const NB={L:[-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
            M:[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49]};
  const FMT={L:1,M:0};
  const rawMods=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r};
  const dataCw=(v,e)=>Math.floor(rawMods(v)/8)-ECC[e][v]*NB[e][v];
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
  function divisor(deg){const r=new Array(deg).fill(0);r[deg-1]=1;let root=1;for(let i=0;i<deg;i++){for(let j=0;j<deg;j++){r[j]=mul(r[j],root);if(j+1<deg)r[j]^=r[j+1]}root=mul(root,2)}return r}
  function remainder(data,div){const r=div.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>{r[i]^=mul(c,f)})}return r}
  function encode(bytes){
    let ver=0,e='M';
    for(let v=1;v<=40&&!ver;v++)for(const ee of ['M','L']){const cc=v<=9?8:16;if(4+cc+bytes.length*8<=dataCw(v,ee)*8&&bytes.length<(1<<cc)){ver=v;e=ee;break}}
    if(!ver)return null;
    const bits=[],put=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1)};
    put(4,4);put(bytes.length,ver<=9?8:16);bytes.forEach(b=>put(b,8));
    const cap=dataCw(ver,e)*8;put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);
    for(let pb=0xEC;bits.length<cap;pb^=0xEC^0x11)put(pb,8);
    const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b)}
    const nb=NB[e][ver],el=ECC[e][ver],raw=Math.floor(rawMods(ver)/8),nShort=nb-raw%nb,shortLen=Math.floor(raw/nb),div=divisor(el),blocks=[];
    for(let i=0,k=0;i<nb;i++){const dat=data.slice(k,k+shortLen-el+(i<nShort?0:1));k+=dat.length;const ec=remainder(dat,div);if(i<nShort)dat.push(0);blocks.push(dat.concat(ec))}
    const cw=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==shortLen-el||j>=nShort)cw.push(b[i])});
    const size=ver*4+17,M=[...Array(size)].map(()=>Array(size).fill(false)),F=[...Array(size)].map(()=>Array(size).fill(false));
    const set=(x,y,d)=>{M[y][x]=d;F[y][x]=true};
    for(let i=0;i<size;i++){set(6,i,i%2===0);set(i,6,i%2===0)}
    const finder=(x,y)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const xx=x+dx,yy=y+dy,d=Math.max(Math.abs(dx),Math.abs(dy));if(xx>=0&&xx<size&&yy>=0&&yy<size)set(xx,yy,d!==2&&d!==4)}};
    finder(3,3);finder(size-4,3);finder(3,size-4);
    const al=[];if(ver>1){const n=Math.floor(ver/7)+2,step=ver===32?26:Math.ceil((ver*4+4)/(n*2-2))*2;al.push(6);for(let q=size-7;al.length<n;q-=step)al.splice(1,0,q)}
    al.forEach((a,i)=>al.forEach((b,j)=>{if((i===0&&j===0)||(i===0&&j===al.length-1)||(i===al.length-1&&j===0))return;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}));
    const fmt=mask=>{const d=FMT[e]<<3|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=(d<<10|r)^0x5412,g=i=>((b>>>i)&1)===1;
      for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(let i=9;i<15;i++)set(14-i,8,g(i));
      for(let i=0;i<8;i++)set(size-1-i,8,g(i));for(let i=8;i<15;i++)set(8,size-15+i,g(i));set(8,size-8,true)};
    fmt(0);
    if(ver>=7){let r=ver;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=ver<<12|r;for(let i=0;i<18;i++){const bit=((b>>>i)&1)===1,a=size-11+i%3,c=Math.floor(i/3);set(a,c,bit);set(c,a,bit)}}
    let bi=0;
    for(let right=size-1;right>=1;right-=2){if(right===6)right=5;for(let v=0;v<size;v++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?size-1-v:v;if(!F[y][x]&&bi<cw.length*8){M[y][x]=((cw[bi>>>3]>>>(7-(bi&7)))&1)===1;bi++}}}
    const mf=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
    const apply=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&mf[m](x,y))M[y][x]=!M[y][x]};
    const penalty=()=>{let p=0;
      for(let y=0;y<size;y++){let run=1;for(let x=1;x<=size;x++){if(x<size&&M[y][x]===M[y][x-1])run++;else{if(run>=5)p+=run-2;run=1}}}
      for(let x=0;x<size;x++){let run=1;for(let y=1;y<=size;y++){if(y<size&&M[y][x]===M[y-1][x])run++;else{if(run>=5)p+=run-2;run=1}}}
      for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3}
      let dark=0;M.forEach(r=>r.forEach(c=>{if(c)dark++}));p+=Math.floor(Math.abs(dark*20-size*size*10)/(size*size))*10;return p};
    let best=0,bp=Infinity;for(let m=0;m<8;m++){apply(m);fmt(m);const pn=penalty();if(pn<bp){bp=pn;best=m}apply(m)}
    apply(best);fmt(best);
    return {size,M,ver,ecl:e};
  }
  return {encode};
})();

/* ---------- 起動 ---------- */
(async function boot(){
  let txtS=null,ph=null;
  try{await IDB.open();txtS=await IDB.get('state');ph=await IDB.get('photos')}catch(e){IDB.db=null}
  if(!txtS){try{txtS=localStorage.getItem(KEY)}catch(e){}}
  try{S=sanitize(JSON.parse(txtS))}catch(e){S=null}
  if(!S)S=sample();
  S=migrate(S);normAll();PHOTOS=cPhotos(ph);
  // 使われていない写真を片付ける
  const used=new Set(S.cands.map(c=>c.photo).filter(Boolean));let rm=false;
  Object.keys(PHOTOS).forEach(k=>{if(!used.has(k)){delete PHOTOS[k];rm=true}});if(rm)savePhotos();
  snap=JSON.stringify(S);
  if(!['plan','shelf','cand'].includes(UI.mode))UI.mode='plan';
  render();requestAnimationFrame(()=>{if(UI.mode!=='cand')fit()});
  saveNow();initCaps();
  booted=true;receiveFromHash();
})();
